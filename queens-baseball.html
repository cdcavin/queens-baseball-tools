<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>
<script type="module">

// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════

// Linear model coefficients for VAA/HAA residuals (from R: lm())
const VAA_COEF = { b0: -23.1821165, velo: 0.1590648, plateZ: 1.1833148 };
const HAA_COEF = { b0:  9.9595758,  velo: -0.0927611, plateSym: 1.2960871 };

// MLB average IVB and HB per Statcast pitch type (from train_means.csv)
const TRAIN_MEANS = {
  FF: { ivb: 15.723, hb: -7.598 },
  CU: { ivb: -9.469, hb:  9.293 },
  ST: { ivb:  1.413, hb: 14.169 },
  SI: { ivb:  7.687, hb:-14.931 },
  FC: { ivb:  7.871, hb:  2.490 },
  SL: { ivb:  1.564, hb:  5.160 },
  CH: { ivb:  5.479, hb:-14.219 },
  FS: { ivb:  3.130, hb:-10.689 },
  KC: { ivb: -9.339, hb:  6.558 },
  KN: { ivb: -2.769, hb: -5.079 },
};

// Normalized pitch name → Statcast code
const TO_SC = {
  Fastball:'FF', Sinker:'SI', Cutter:'FC', Slider:'SL',
  Curveball:'CU', ChangeUp:'CH', Splitter:'FS', Sweeper:'ST',
  Knuckleball:'KC',
};

const API_URL = 'https://cdcavin-queens-api.hf.space';

// Colors (consistent with tunneling app)
const COLORS = {
  Fastball:'#ef4444', Sinker:'#f97316', Cutter:'#eab308',
  Slider:'#8b5cf6',  Curveball:'#3b82f6', ChangeUp:'#10b981',
  Splitter:'#06b6d4', Sweeper:'#ec4899',  Knuckleball:'#6b7280',
};

// Verified QUC arsenals (from scouting card)
const QUEENS_ARSENAL = {
  ruller:    ['Fastball','Sinker','Slider','Cutter','ChangeUp'],
  eagen:     ['Fastball','Sinker','Slider','Curveball','ChangeUp'],
  gowan:     ['Fastball','Sinker','Slider','ChangeUp','Curveball'],
  quezada:   ['Fastball','Sinker','Slider','Cutter','Curveball','ChangeUp'],
  young:     ['Fastball','Slider','Cutter','ChangeUp'],
  shipman:   ['Fastball','Sinker','Slider','Curveball','ChangeUp'],
  pollard:   ['Fastball','Curveball','Cutter'],
  joseph:    ['Sinker','Fastball','Slider','ChangeUp'],
  booker:    ['Fastball','Curveball','ChangeUp'],
  clevidence:['Fastball','Curveball','ChangeUp'],
  martino:   ['Fastball','Curveball','Cutter','Knuckleball'],
  hudson:    ['Fastball','Slider','ChangeUp'],
  green:     ['Fastball','Sinker','Slider','ChangeUp'],
  jones:     ['Fastball','Sinker','Curveball','ChangeUp','Slider'],
  neave:     ['Sinker','Slider','ChangeUp'],
  brodeur:   ['Fastball','Slider','ChangeUp'],
  savona:    ['Fastball','Curveball'],
};

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
const avg = arr => arr.length ? arr.reduce((s,v)=>s+v,0)/arr.length : null;
const color = t => COLORS[t] || '#94a3b8';
const fmt = (v, d=1, u='') => v != null ? v.toFixed(d) + u : '—';

function normalizePitchType(t) {
  if (!t || t==='Unknown') return 'Unknown';
  const l = t.toLowerCase().replace(/[\\s_-]/g,'');
  if (l.includes('fourseam')||l==='fastball'||l==='4seam') return 'Fastball';
  if (l.includes('twoseam')||l==='sinker') return 'Sinker';
  if (l.includes('changeup')||l.includes('change')) return 'ChangeUp';
  if (l.includes('curveball')||l.includes('curve')) return 'Curveball';
  if (l.includes('slider')) return 'Slider';
  if (l.includes('sweeper')) return 'Sweeper';
  if (l.includes('cutter')) return 'Cutter';
  if (l.includes('splitter')||l.includes('split')) return 'Splitter';
  if (l.includes('knuckle')) return 'Knuckleball';
  return t;
}

function isQueens(p) {
  const t = (p.PitcherTeam||'').toLowerCase();
  return t.includes('qun')||t.includes('quc')||t.includes('queens')||t.includes('ryl')||t==='';
}

function getWhitelist(pitches, pitcherId) {
  const p = pitches.find(p=>p.PitcherId===pitcherId);
  if (!p) return null;
  const name = (p.Pitcher||'').toLowerCase();
  for (const [k,v] of Object.entries(QUEENS_ARSENAL))
    if (name.includes(k)) return new Set(v);
  return null;
}

function getPitchTypes(pitches, pitcherId) {
  const wl = getWhitelist(pitches, pitcherId);
  const counts = {};
  let total = 0;
  for (const p of pitches) {
    if (p.PitcherId!==pitcherId||!p.pitchType||p.pitchType==='Unknown') continue;
    counts[p.pitchType] = (counts[p.pitchType]||0)+1;
    total++;
  }
  if (wl) return Object.entries(counts).filter(([t])=>wl.has(t)).sort((a,b)=>b[1]-a[1]).map(([t])=>t);
  const MIN=5, PCT=0.03;
  return Object.entries(counts).filter(([,c])=>c>=MIN&&c/total>=PCT).sort((a,b)=>b[1]-a[1]).map(([t])=>t);
}

// ═══════════════════════════════════════════════════════════════
// CSV PARSING
// ═══════════════════════════════════════════════════════════════
function parseCSV(text) {
  const res = window.Papa.parse(text, { header:true, dynamicTyping:false, skipEmptyLines:true });
  return res.data.filter(row => !String(row.Pitcher||'').toLowerCase().includes('keontay')).map(row => {
    const tagged = row.TaggedPitchType, auto = row.AutoPitchType;
    const rawType = (tagged&&tagged!=='Undefined'&&tagged!=='')?tagged:
                    (auto&&auto!=='Undefined'&&auto!=='')?auto:'Unknown';
    return { ...row, pitchType: normalizePitchType(rawType) };
  });
}

// ═══════════════════════════════════════════════════════════════
// METRIC COMPUTATION
// ═══════════════════════════════════════════════════════════════
function computeVAA(p) {
  const vy0=num(p.vy0), vz0=num(p.vz0), ay=num(p.ay0), az=num(p.az0);
  if ([vy0,vz0,ay,az].some(v=>v==null)) return null;
  const ft = (1.4167-50)/vy0;
  return Math.atan((vz0+az*ft)/(-(vy0+ay*ft)))*(180/Math.PI);
}

function computeHAA(p) {
  const vx0=num(p.vx0), vy0=num(p.vy0), ax=num(p.ax0), ay=num(p.ay0);
  if ([vx0,vy0,ax,ay].some(v=>v==null)) return null;
  const ft = (1.4167-50)/vy0;
  return Math.atan((vx0+ax*ft)/(-(vy0+ay*ft)))*(180/Math.PI);
}

// Arm slot: angle above horizontal at release point (degrees)
// 90° = straight overhand, 45° = three-quarter, ~0° = sidearm, negative = submarine
// Spin efficiency derived from physics: actual Magnus movement vs. theoretical max.
// Magnus force ∝ spin_rate × velocity. At 100% efficiency all spin produces movement.
// Reference: at 2500 RPM, 95 mph → ~20" max total break (calibrated from physics lit).
// IVB already has gravity removed, so sqrt(IVB²+HB²) is pure Magnus contribution.
function computeSpinEff(p) {
  const ivb = num(p.InducedVertBreak);
  const hb  = num(p.HorzBreak);
  const rpm = num(p.SpinRate);
  const mph = num(p.RelSpeed);
  if (ivb == null || hb == null || !rpm || rpm < 100 || !mph || mph < 30) return null;
  const actualBreak = Math.sqrt(ivb * ivb + hb * hb);
  const maxBreak    = (rpm / 2500) * (95 / mph) * 20;  // theoretical 100% efficiency
  if (maxBreak <= 0) return null;
  return Math.min(100, Math.max(0, (actualBreak / maxBreak) * 100));
}

// Queens pitcher heights (inches) — used to compute an effective shoulder
// height for arm-angle estimation. Empirically the shoulder-to-ball line
// matches baseball-intuitive arm angles (3/4 ~45°, overhead ~60°) when the
// effective shoulder sits at ~0.55 × player height.
const PITCHER_HEIGHTS_IN = {
  quezada:74, gowan:71, shipman:73, neave:75, jones:73, young:74,
  clevidence:73, eagen:74, pollard:76, martino:74, joseph:74,
  savona:76, brodeur:78, hudson:76,
};
function lookupPitcherHeightFt(pitcherName) {
  if (!pitcherName) return null;
  const lower = pitcherName.toLowerCase();
  for (const k in PITCHER_HEIGHTS_IN) if (lower.includes(k)) return PITCHER_HEIGHTS_IN[k] / 12;
  return null;
}

function computeArmSlot(relHeight, relSide, hand, pitcherName) {
  if (relHeight==null || relSide==null) return null;
  // Effective shoulder height: per-pitcher if we have their stature,
  // otherwise a 4.0 ft fallback that's calibrated for ~6' pitchers.
  // Matches R app formula: atan2(|RelSide|, RelHeight - pivot), pivot = height_ft * 0.43
  const heightFt = lookupPitcherHeightFt(pitcherName);
  const pivot = heightFt != null ? heightFt * 0.43 : (73/12) * 0.43;
  const dh = relHeight - pivot;
  const ds = Math.abs(relSide);
  return Math.atan2(ds, dh) * (180/Math.PI);
}

function pitchMetrics(pitches) {
  if (!pitches.length) return null;
  const hand = pitches[0]?.PitcherThrows||'R';
  const pitcherName = pitches[0]?.Pitcher || '';
  const vals = k => pitches.map(p=>num(p[k])).filter(v=>v!=null);
  const veloArr    = vals('RelSpeed');
  const ivbArr     = vals('InducedVertBreak');
  const hbArr      = vals('HorzBreak');
  const spinArr    = vals('SpinRate');
  const spinEffArr = pitches.map(computeSpinEff).filter(v => v != null);
  const rhArr      = vals('RelHeight');
  const rsArr      = vals('RelSide');
  const extArr     = vals('Extension');
  const vaaArr     = pitches.map(computeVAA).filter(v=>v!=null);
  const haaArr     = pitches.map(computeHAA).filter(v=>v!=null);
  const plhArr     = vals('PlateLocHeight');

  const avgRH = avg(rhArr), avgRS = avg(rsArr);
  const armSlot = computeArmSlot(avgRH, avgRS, hand, pitcherName);

  return {
    hand, count: pitches.length,
    velo:      avg(veloArr),
    ivb:       avg(ivbArr),
    hb:        avg(hbArr),
    spin:      avg(spinArr),
    spinEff:   avg(spinEffArr),
    relHeight: avgRH,
    relSide:   avgRS,
    extension: avg(extArr),
    vaa:       avg(vaaArr),
    haa:       avg(haaArr),
    armSlot,
    plateZ:    avg(plhArr),
  };
}

// Confidence based on sample size — more pitches = more reliable averages
function confidence(m, pitchType) {
  const sc = TO_SC[pitchType];
  if (!sc || !TRAIN_MEANS[sc] || m.ivb == null || m.hb == null) return null;
  const tm = TRAIN_MEANS[sc];

  // Convert m.hb (Trackman HorzBreak, positive=arm side) → pfx_x_sym convention
  // (same convention as TRAIN_MEANS: RHP pfx_x_sym = −HorzBreak, LHP = +HorzBreak)
  // PitcherThrows in Trackman CSVs is "Right"/"Left", not "R"/"L"
  const isLefty = m.hand === 'L' || m.hand === 'Left' || m.hand === 'LHP';
  const hbSym = isLefty ? m.hb : -m.hb;

  // Mahalanobis-style distance from MLB training mean (IVB + HB, ~4" SD each)
  const dIVB = (m.ivb  - tm.ivb) / 4;
  const dHB  = (hbSym  - tm.hb)  / 4;
  const dist = Math.sqrt(dIVB ** 2 + dHB ** 2);

  // Exponential decay: dist=0 → 100, dist=1 (1 SD) → ~78, dist=2 → ~37, dist=3 → ~11
  return Math.max(0, Math.min(100, Math.round(100 * Math.exp(-0.25 * dist ** 2))));
}

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let allPitches = [];
const state = {
  pitches: [],
  pitcherId: null,
  selectedType: null,
  queensOnly: true,
  perturbation: {},  // { type: { velo, ivb, hb, vaa, relHeight } deltas }
};
let pitcherData = {}; // { type: { pitches[], metrics } }

// staffScores: populated async after CSV load by scoring all pitchers
// key: \`\${pitcherId}__\${type}\`, value: { score, isQueens, type, pitcherId }
let staffScores = new Map();
let staffScoringDone = false;

function buildPitcherData(id) {
  const types = getPitchTypes(state.pitches, id);
  pitcherData = {};
  for (const type of types) {
    const ps = state.pitches.filter(p=>p.PitcherId===id&&p.pitchType===type);
    pitcherData[type] = { pitches: ps, metrics: pitchMetrics(ps) };
  }
}

// ═══════════════════════════════════════════════════════════════
// PITCHER SELECTOR
// ═══════════════════════════════════════════════════════════════
function populatePitchers() {
  const sel = document.getElementById('pitcher-sel');
  const seen = new Map();
  for (const p of state.pitches) {
    if (state.queensOnly && !isQueens(p)) continue;
    if (p.PitcherId && !seen.has(p.PitcherId))
      seen.set(p.PitcherId, { id:p.PitcherId, name:p.Pitcher||p.PitcherId, throws:p.PitcherThrows||'' });
  }
  const pitchers = Array.from(seen.values()).sort((a,b)=>a.name.localeCompare(b.name));
  sel.innerHTML = '<option value="">— select pitcher —</option>';
  pitchers.forEach(p => {
    const o = document.createElement('option');
    o.value = p.id; o.textContent = \`\${p.name} (\${p.throws})\`;
    sel.appendChild(o);
  });
}

// ═══════════════════════════════════════════════════════════════
// ARSENAL LIST
// ═══════════════════════════════════════════════════════════════
function renderArsenal() {
  const el = document.getElementById('arsenal-list');
  const types = Object.keys(pitcherData);
  if (!types.length) { el.innerHTML='<p style="font-size:11px;color:#334155">No pitch data</p>'; return; }
  el.innerHTML = '';
  for (const type of types) {
    const m = pitcherData[type].metrics;
    if (!m) continue;
    const conf = confidence(m, type);
    const c = color(type);
    const row = document.createElement('div');
    row.className = 'arsenal-row'+(state.selectedType===type?' selected':'');
    row.innerHTML = \`
      <div class="arsenal-row-hdr">
        <span class="a-dot" style="background:\${c}"></span>
        <span class="a-name">\${type}</span>
        <span class="a-count">(\${m.count})</span>
      </div>
      <div class="a-metrics">
        \${m.velo!=null?\`<span>\${m.velo.toFixed(1)} mph</span>\`:''}
        \${m.ivb!=null?\`<span>\${m.ivb.toFixed(1)}" IVB</span>\`:''}
        \${m.hb!=null?\`<span>\${m.hb.toFixed(1)}" HB</span>\`:''}
        \${m.vaa!=null?\`<span>\${m.vaa.toFixed(1)}° VAA</span>\`:''}
      </div>
      \${conf!=null?\`
        <div class="conf-bar-wrap"><div class="conf-bar" style="width:\${conf}%;background:\${conf>=75?'#22c55e':conf>=50?'#f59e0b':'#ef4444'}"></div></div>
        <div style="font-size:9px;color:#64748b;margin-top:2px">Confidence: \${conf}%</div>
      \`:''}\`;
    row.addEventListener('click', () => { state.selectedType=type; update(); });
    el.appendChild(row);
  }
}

// ═══════════════════════════════════════════════════════════════
// METRICS PANEL
// ═══════════════════════════════════════════════════════════════
function renderMetrics() {
  const el = document.getElementById('pitch-metrics');
  if (!state.selectedType||!pitcherData[state.selectedType]) {
    el.innerHTML='<p style="font-size:11px;color:#334155">Select a pitch type</p>'; return;
  }
  const m = pitcherData[state.selectedType].metrics;
  const pert = state.perturbation[state.selectedType]||{};
  const rows = [
    ['Velocity',    m.velo,      pert.velo,      'mph', 1],
    ['IVB',         m.ivb,       pert.ivb,        '"',  1],
    ['HB',          m.hb,        pert.hb,          '"',  1],
    ['Spin Eff',    m.spinEff,   pert.spinEff,   '%',   1],
    ['VAA',         m.vaa,       pert.vaa,        '°',  2],
    ['HAA',         m.haa,       pert.haa,        '°',  2],
    ['Arm Angle',   m.armSlot,   pert.armSlot,    '°',  1],
    ['Extension',   m.extension, null,          ' ft',  2],
  ];
  const conf = confidence(m, state.selectedType);
  const confColor = conf == null ? '#334155' : conf >= 75 ? '#22c55e' : conf >= 50 ? '#f59e0b' : '#ef4444';

  el.innerHTML = rows.filter(([,v])=>v!=null).map(([lbl,v,delta,u,d])=>{
    const disp = delta!=null && delta!==0 ? v+delta : v;
    const changed = delta!=null && delta!==0;
    // HB: show as unsigned magnitude with ASB/GSB direction tag
    const isHB = lbl === 'HB';
    const dispStr = isHB
      ? \`\${Math.abs(disp).toFixed(d)}" \${disp >= 0 ? 'ASB' : 'GSB'}\`
      : \`\${disp.toFixed(d)}\${u}\`;
    return \`<div class="metric-row">
      <span class="metric-lbl">\${lbl}</span>
      <span class="metric-val" style="\${changed?'color:#f59e0b':''}">\${dispStr}\${changed?\` <span style="font-size:9px;color:#f59e0b88">(\${delta>0?'+':''}\${delta.toFixed(d)}\${isHB?'"':''})</span>\`:''}</span>
    </div>\`;
  }).join('')
  + (conf != null ? \`
    <div style="margin-top:8px;padding-top:8px;border-top:1px solid #1e293b">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span class="metric-lbl">MLB Shape Confidence</span>
        <span class="metric-val" style="color:\${confColor}">\${conf}%</span>
      </div>
      <div style="background:#1e293b;border-radius:3px;height:4px;overflow:hidden">
        <div style="width:\${conf}%;height:100%;border-radius:3px;background:\${confColor};transition:width .3s"></div>
      </div>
      <div style="font-size:8px;color:#334155;margin-top:3px">Distance from MLB training average</div>
    </div>\` : '');
}

// ═══════════════════════════════════════════════════════════════
// SHAPE+ PANEL
// ═══════════════════════════════════════════════════════════════
function buildPayload(type, pitches, overrides={}) {
  const sc = TO_SC[type];
  if (!sc) return null;
  const hand = pitches[0]?.PitcherThrows || 'R';
  const throws = (hand==='Left'||hand==='LHP') ? 'L' : 'R';

  return pitches.map(p => {
    const velo  = num(p.RelSpeed)  + (overrides.velo || 0);
    const ivb   = num(p.InducedVertBreak) + (overrides.ivb  || 0);
    const hb    = num(p.HorzBreak) + (overrides.hb   || 0);
    const relH  = num(p.RelHeight) + (overrides.relHeight || 0);
    const relS  = num(p.RelSide)   + (overrides.relSide   || 0);
    const ext   = num(p.Extension) || 6.0;
    const vy0   = num(p.vy0);
    if (!velo || !vy0) return null;

    const ay = num(p.ay0), az = num(p.az0), ax = num(p.ax0);
    const ft  = (1.4167 - 50) / vy0;   // flight time from release to plate

    // VAA perturbation: back-calculate vz0 that produces desired VAA
    let vz0 = num(p.vz0);
    if (overrides.vaa && vz0 != null && ay != null && az != null) {
      const vaaOrig = Math.atan((vz0 + az * ft) / (-(vy0 + ay * ft))) * 180 / Math.PI;
      const vaaNew  = vaaOrig + overrides.vaa;
      vz0 = Math.tan(vaaNew * Math.PI / 180) * (-(vy0 + ay * ft)) - az * ft;
    }

    // HAA perturbation: back-calculate vx0 that produces desired HAA
    let vx0 = num(p.vx0);
    if (overrides.haa && vx0 != null && ay != null && ax != null) {
      const haaOrig = Math.atan((vx0 + ax * ft) / (-(vy0 + ay * ft))) * 180 / Math.PI;
      const haaNew  = haaOrig + overrides.haa;
      vx0 = Math.tan(haaNew * Math.PI / 180) * (-(vy0 + ay * ft)) - ax * ft;
    }

    return {
      pitch_type:        sc,
      p_throws:          throws,
      release_speed:     velo,
      pfx_z:             ivb,
      pfx_x:             -(hb),
      plate_x:           num(p.PlateLocSide),
      plate_z:           num(p.PlateLocHeight),
      release_pos_x:     relS,
      release_pos_z:     relH,
      release_extension: ext,
      vx0, vy0, vz0,
      ax, ay, az: num(p.az0),
    };
  }).filter(Boolean);
}

async function scoreType(type, overrides={}) {
  if (!pitcherData[type]) return null;
  const payload = buildPayload(type, pitcherData[type].pitches, overrides);
  if (!payload.length) return null;
  try {
    const resp = await fetch(\`\${API_URL}/score\`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!resp.ok) return null;
    return await resp.json();
  } catch(e) {
    console.warn('API unavailable:', e.message);
    return null;
  }
}

async function scoreArbitraryPitches(type, pitches) {
  if (!pitches || !pitches.length) return null;
  const payload = buildPayload(type, pitches);
  if (!payload || !payload.length) return null;
  try {
    const resp = await fetch(\`\${API_URL}/score\`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!resp.ok) return null;
    return await resp.json();
  } catch(e) { return null; }
}

async function scoreAllStaff() {
  staffScores.clear();
  staffScoringDone = false;

  // Collect all unique pitchers in loaded data
  const seen = new Map();
  for (const p of state.pitches) {
    if (!p.PitcherId) continue;
    if (!seen.has(p.PitcherId)) seen.set(p.PitcherId, isQueens(p));
  }

  let done = 0;
  const total = seen.size;

  for (const [pid, isQ] of seen) {
    const types = getPitchTypes(state.pitches, pid);
    for (const type of types) {
      const ps = state.pitches.filter(p => p.PitcherId === pid && p.pitchType === type);
      if (ps.length < 3) continue;
      const result = await scoreArbitraryPitches(type, ps);
      if (result && result.shape_plus && result.shape_plus.length) {
        const avg = result.shape_plus.reduce((a, b) => a + b, 0) / result.shape_plus.length;
        staffScores.set(\`\${pid}__\${type}\`, { score: avg, isQueens: isQ, type, pitcherId: pid });
      }
    }
    done++;
    // Update UI note if a pitch is selected
    if (state.selectedType) {
      const note = document.getElementById('api-note');
      if (note) note.textContent = \`Scoring staff… (\${done}/\${total})\`;
    }
  }

  staffScoringDone = true;
  // Re-render scores now that staff data is available
  if (state.selectedType) renderScoresFromAPI();
}

function computeQShapePlus(rawScore) {
  // Normalize rawScore to distribution of all pitchers in loaded data
  const allScores = Array.from(staffScores.values()).map(v => v.score);
  if (allScores.length < 3) return rawScore; // not enough data, return raw
  const mean = allScores.reduce((a, b) => a + b, 0) / allScores.length;
  const sd = Math.sqrt(allScores.reduce((s, v) => s + (v - mean) ** 2, 0) / allScores.length);
  if (sd < 0.01) return 100;
  return ((rawScore - mean) / sd) * 10 + 100;
}

function computeQueensPercentile(rawScore, type) {
  // Get Queens-only scores for the same pitch type
  const queenSameType = Array.from(staffScores.values())
    .filter(v => v.isQueens && v.type === type)
    .map(v => v.score);

  if (queenSameType.length < 2) {
    // Fall back to all Queens pitch types
    const allQueens = Array.from(staffScores.values())
      .filter(v => v.isQueens)
      .map(v => v.score);
    if (allQueens.length < 2) return null;
    const below = allQueens.filter(s => s < rawScore).length;
    return { pct: Math.round((below / allQueens.length) * 100), n: allQueens.length, type: 'all' };
  }

  const below = queenSameType.filter(s => s < rawScore).length;
  const rank = queenSameType.filter(s => s > rawScore).length + 1; // 1 = best
  return {
    pct: Math.round((below / queenSameType.length) * 100),
    n: queenSameType.length,
    rank,
    type: 'same',
  };
}

function ordinal(n) {
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

function renderTermBreakdown(terms) {
  const el = document.getElementById('term-breakdown');
  if (!el) return;

  const LABELS = {
    's(release_speed)': 'Velocity', 's(pfx_z)': 'IVB', 's(pfx_x_sym)': 'HB',
    's(release_pos_z)': 'Rel Height', 's(rel_x_sym)': 'Rel Side',
    's(release_extension)': 'Extension', 's(vaa_resid)': 'VAA',
    's(haa_resid_sym)': 'HAA', 's(ivb_diff)': 'IVB vs Avg', 's(hb_diff_sym)': 'HB vs Avg',
    'ti(release_speed,pfx_z)': 'Velo×IVB', 'ti(release_speed,vaa_resid)': 'Velo×VAA',
    's(pitch_type)': 'Pitch Type', 'p_throws': 'Handedness',
  };

  // Flip sign: raw GAM term is the model's loss value, so negative raw = good for Shape+.
  // contrib > 0 means this factor is HELPING the score; < 0 means HURTING.
  const entries = Object.entries(terms)
    .filter(([k]) => k !== 'p_throws' && k !== 's(pitch_type)')
    .map(([k, v]) => [LABELS[k] || k, -(Array.isArray(v) ? v[0] : v)])
    .filter(([, v]) => Math.abs(v) >= 0.001)   // drop only truly zero terms
    .sort((a, b) => b[1] - a[1])   // helpers first, hurters last
    .slice(0, 8);

  const maxAbs = Math.max(...entries.map(([, v]) => Math.abs(v)), 0.01);

  const type = state.selectedType;
  const dot = type ? \`<span class="drivers-dot" style="background:\${color(type)}"></span>\` : '';

  const helpers = entries.filter(([, v]) => v > 0);
  const hurters = entries.filter(([, v]) => v <= 0).reverse(); // worst first within hurters

  function driverBar(label, contrib) {
    const pct = Math.abs(contrib) / maxAbs * 100;
    const clr = contrib > 0 ? '#22c55e' : '#ef4444';
    const sign = contrib > 0 ? '+' : '';
    return \`<div style="margin-bottom:5px">
      <div style="display:flex;justify-content:space-between;font-size:9px;color:#94a3b8;margin-bottom:2px">
        <span>\${label}</span>
        <span style="color:\${clr};font-weight:700">\${sign}\${contrib.toFixed(2)}</span>
      </div>
      <div style="background:#1e293b;border-radius:2px;height:5px">
        <div style="width:\${pct}%;height:100%;border-radius:2px;background:\${clr}"></div>
      </div>
    </div>\`;
  }

  let html = \`<div class="drivers-header">\${dot}<span class="drivers-title">\${type || ''} Score Drivers</span></div>\`;
  if (helpers.length) {
    html += \`<div style="font-size:8px;color:#22c55e99;font-weight:700;letter-spacing:.05em;margin:4px 0 5px">▲ HELPING</div>\`;
    html += helpers.map(([l, v]) => driverBar(l, v)).join('');
  }
  if (hurters.length) {
    html += \`<div style="font-size:8px;color:#ef444499;font-weight:700;letter-spacing:.05em;margin:\${helpers.length ? 8 : 4}px 0 5px">▼ HURTING</div>\`;
    html += hurters.map(([l, v]) => driverBar(l, v)).join('');
  }
  el.innerHTML = html;
}

async function renderScoresFromAPI(overrides={}) {
  const type = state.selectedType;
  if (!type) return;

  document.getElementById('shape-val').textContent = '…';
  document.getElementById('api-note').textContent = 'Scoring…';

  // Translate armSlot delta → relHeight + relSide deltas for the API
  // (same back-calculation used by perturbCoeffs for the 3D scene)
  const apiOverrides = { ...overrides };
  if (overrides.armSlot && pitcherData[type]?.metrics) {
    const m = pitcherData[type].metrics;
    if (m.relHeight != null && m.relSide != null) {
      const SHOULDER_H = 4.0;
      const h0 = m.relHeight - SHOULDER_H;
      const s0 = Math.abs(m.relSide);
      const armRadius = Math.sqrt(h0 * h0 + s0 * s0) || 1.5;
      const oldAngle  = Math.atan2(h0, s0);
      const newAngle  = oldAngle + (overrides.armSlot * Math.PI / 180);
      apiOverrides.relHeight = armRadius * Math.sin(newAngle) - h0;  // delta from original
      const sideSign = m.relSide < 0 ? -1 : 1;
      apiOverrides.relSide   = (armRadius * Math.cos(newAngle) - s0) * sideSign;
    }
    delete apiOverrides.armSlot;
  }

  // Translate spinEff delta → scaled IVB + HB deltas for the API.
  // Spin efficiency is a multiplier on how much spin becomes Magnus force (movement).
  // effective_movement = (actual + manual_delta) × (spinEff + spinEff_delta) / spinEff
  // This matches exactly what perturbCoeffs does for the 3D trajectory — consistent behavior.
  if (overrides.spinEff && pitcherData[type]?.metrics) {
    const m = pitcherData[type].metrics;
    if (m.spinEff != null && m.spinEff > 0 && m.ivb != null && m.hb != null) {
      const newEff  = Math.min(100, m.spinEff + overrides.spinEff);
      const effMult = newEff / m.spinEff;
      const baseIVB = m.ivb;
      const baseHB  = m.hb;
      const pertIVB = apiOverrides.ivb || 0;
      const pertHB  = apiOverrides.hb  || 0;
      // Scale the already-perturbed IVB/HB by efficiency ratio, then compute net delta
      apiOverrides.ivb = (baseIVB + pertIVB) * effMult - baseIVB;
      apiOverrides.hb  = (baseHB  + pertHB)  * effMult - baseHB;
    }
    delete apiOverrides.spinEff;
  }

  const result = await scoreType(type, apiOverrides);

  if (!result || result.error) {
    document.getElementById('shape-val').textContent = '—';
    document.getElementById('api-note').textContent = result?.error || 'API unavailable';
    return;
  }

  const scores = result.shape_plus;
  const avgScore = scores.reduce((s,v)=>s+v,0) / scores.length;

  const rawScore = avgScore; // this is the MLB-normalized Shape+ from the model
  const qScore = staffScoringDone ? computeQShapePlus(rawScore) : rawScore;
  const displayScore = Math.round(qScore);

  const scoreColor = qScore >= 110 ? '#22c55e'
                   : qScore >= 100 ? '#60a5fa'
                   : qScore >= 90  ? '#f59e0b'
                   : '#ef4444';

  const shapeEl = document.getElementById('shape-val');
  shapeEl.textContent = displayScore;
  shapeEl.style.color = scoreColor;
  const mainBox = document.getElementById('shape-main-box');
  if (mainBox) mainBox.style.borderColor = scoreColor + '60';

  document.getElementById('api-note').textContent = staffScoringDone
    ? \`n=\${scores.length} pitches\`
    : \`n=\${scores.length} pitches — scoring staff…\`;

  // Queens percentile
  const pctEl = document.getElementById('pct-val');
  const pctBar = document.getElementById('pct-bar');
  const pctLbl = document.getElementById('pct-lbl');
  if (staffScoringDone && pctEl) {
    const pctInfo = computeQueensPercentile(rawScore, type);
    if (pctInfo) {
      pctEl.textContent = pctInfo.pct + 'th';
      pctEl.style.color = pctInfo.pct >= 75 ? '#22c55e' : pctInfo.pct >= 50 ? '#60a5fa' : pctInfo.pct >= 25 ? '#f59e0b' : '#ef4444';
      if (pctBar) { pctBar.style.width = pctInfo.pct + '%'; pctBar.style.background = pctEl.style.color; }
      if (pctLbl && pctInfo.type === 'same') {
        pctLbl.textContent = \`\${ordinal(pctInfo.rank)} of \${pctInfo.n} \${type}s on staff\`;
      } else if (pctLbl) {
        pctLbl.textContent = \`vs Queens staff (all types)\`;
      }
    } else {
      if (pctEl) pctEl.textContent = '—';
      if (pctLbl) pctLbl.textContent = 'Need more staff data';
    }
  } else if (pctEl) {
    pctEl.textContent = '…';
    if (pctLbl) pctLbl.textContent = 'Scoring staff…';
  }

  if (result.terms?.length) {
    const avgTerms = {};
    for (const t of result.terms) {
      for (const [k,v] of Object.entries(t)) {
        avgTerms[k] = (avgTerms[k]||0) + (Array.isArray(v)?v[0]:v);
      }
    }
    for (const k of Object.keys(avgTerms)) avgTerms[k] /= result.terms.length;
    renderTermBreakdown(avgTerms);
  }
}

function renderScores() {
  renderScoresFromAPI();
}

// ═══════════════════════════════════════════════════════════════
// PERTURBATION SLIDERS
// ═══════════════════════════════════════════════════════════════
const SLIDERS = [
  { key:'velo',    label:'Velocity',       unit:' mph', dec:1, range:5,   step:0.5,  metricsKey:'velo'    },
  { key:'ivb',     label:'IVB',            unit:'"',    dec:1, range:6,   step:0.5,  metricsKey:'ivb'     },
  { key:'hb',      label:'HB',             unit:'"',    dec:1, range:6,   step:0.5,  metricsKey:'hb'      },
  { key:'vaa',     label:'VAA',            unit:'°',    dec:2, range:3,   step:0.1,  metricsKey:'vaa'     },
  { key:'haa',     label:'HAA',            unit:'°',    dec:2, range:2,   step:0.1,  metricsKey:'haa'     },
  { key:'armSlot', label:'Arm Angle',      unit:'°',    dec:1, range:15,  step:1,    metricsKey:'armSlot' },
];

function renderPerturbSliders() {
  const el = document.getElementById('perturb-sliders');
  if (!state.selectedType||!pitcherData[state.selectedType]) {
    el.innerHTML='<p style="font-size:11px;color:#334155">Select a pitch type</p>'; return;
  }
  const m   = pitcherData[state.selectedType].metrics;
  const per = state.perturbation[state.selectedType] || {};
  const c   = color(state.selectedType);

  // HB is signed (positive=arm side, negative=glove side). Reorient the slider
  // so moving right always = more break, and display as unsigned magnitude with
  // a direction tag (ASB/GSB).
  const fmtHB = (v) => Math.abs(v).toFixed(1) + '" ' + (v >= 0 ? 'ASB' : 'GSB');

  el.innerHTML = SLIDERS.filter(s=>m[s.metricsKey]!=null).map(s=>{
    const ref   = m[s.metricsKey];
    const delta = per[s.key] || 0;
    const cur   = ref + delta;
    if (s.key === 'hb') {
      const dir = ref >= 0 ? 1 : -1;  // pitch's native break direction
      const slVal = delta * dir;      // visual slider value: right = more break
      const minBreak = Math.abs(ref) - s.range;  // display value at far left
      const maxBreak = Math.abs(ref) + s.range;  // display value at far right
      const dirTag = ref >= 0 ? 'ASB' : 'GSB';
      return \`<div class="slider-row">
        <div class="slider-hdr">
          <span class="slider-lbl-txt">\${s.label}</span>
          <span class="slider-val-txt" id="sv-\${s.key}">\${fmtHB(cur)}</span>
        </div>
        <input type="range" id="sl-\${s.key}" min="\${-s.range}" max="\${s.range}" step="\${s.step}" value="\${slVal.toFixed(3)}" style="accent-color:\${c}"/>
        <div class="slider-range-row">
          <span>\${minBreak.toFixed(1)}" \${dirTag}</span>
          <span class="slider-avg">avg \${Math.abs(ref).toFixed(1)}" \${dirTag}</span>
          <span>\${maxBreak.toFixed(1)}" \${dirTag}</span>
        </div>
      </div>\`;
    }
    // For spin efficiency, cap the upper end so ref+max never exceeds 100%
    const maxRange = s.key === 'spinEff' ? Math.min(s.range, 100 - ref) : s.range;
    const dispMax  = s.key === 'spinEff' ? Math.min(ref + s.range, 100) : ref + s.range;
    return \`<div class="slider-row">
      <div class="slider-hdr">
        <span class="slider-lbl-txt">\${s.label}</span>
        <span class="slider-val-txt" id="sv-\${s.key}">\${cur.toFixed(s.dec)}\${s.unit}</span>
      </div>
      <input type="range" id="sl-\${s.key}" min="\${-s.range}" max="\${maxRange}" step="\${s.step}" value="\${delta.toFixed(3)}" style="accent-color:\${c}"/>
      <div class="slider-range-row">
        <span>\${(ref-s.range).toFixed(s.dec)}\${s.unit}</span>
        <span class="slider-avg">avg \${ref.toFixed(s.dec)}\${s.unit}</span>
        <span>\${dispMax.toFixed(s.dec)}\${s.unit}</span>
      </div>
    </div>\`;
  }).join('');

  // Attach events — only updates plot, NOT full re-render
  for (const s of SLIDERS.filter(s=>m[s.metricsKey]!=null)) {
    const sl  = document.getElementById(\`sl-\${s.key}\`);
    const val = document.getElementById(\`sv-\${s.key}\`);
    if (!sl) continue;
    sl.addEventListener('input', () => {
      const ref = m[s.metricsKey];
      let delta;
      if (s.key === 'hb') {
        const dir = ref >= 0 ? 1 : -1;
        delta = parseFloat(sl.value) * dir;  // map visual → signed HB delta
      } else {
        delta = parseFloat(sl.value);
      }
      if (!state.perturbation[state.selectedType]) state.perturbation[state.selectedType]={};
      state.perturbation[state.selectedType][s.key] = delta;
      const cur = ref + delta;
      val.textContent = s.key === 'hb' ? fmtHB(cur) : cur.toFixed(s.dec) + s.unit;
      // Lightweight updates — no DOM teardown
      drawPlot();
      render3DScene();
      renderMetrics();
      updatePerturbBadge();
      const per = state.perturbation[state.selectedType] || {};
      renderScoresFromAPI(per);
    });
  }
}

function updatePerturbBadge() {
  const per = state.perturbation[state.selectedType]||{};
  const active = Object.values(per).some(v=>v!==0);
  document.getElementById('perturb-badge').classList.toggle('active', active);
}

// ═══════════════════════════════════════════════════════════════
// MOVEMENT PLOT (Canvas 2D)
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('plot-canvas');
const ctx    = canvas.getContext('2d');
const PAD    = 52;
const PLOT   = { xMin:-25, xMax:25, yMin:-25, yMax:25 };

function toCanvas(hb, ivb) {
  const w = canvas.width-PAD*2, h = canvas.height-PAD*2;
  return [
    PAD + ((hb-PLOT.xMin)/(PLOT.xMax-PLOT.xMin))*w,
    PAD + (1-(ivb-PLOT.yMin)/(PLOT.yMax-PLOT.yMin))*h,
  ];
}

function drawPlot() {
  const wrap = canvas.parentElement;
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  const W = canvas.width, H = canvas.height;

  // Background
  ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,W,H);

  // Grid
  ctx.lineWidth=1;
  for (let v=-20; v<=20; v+=5) {
    const alpha = v===0?'#334155':'#1e293b';
    ctx.strokeStyle=alpha;
    // Vertical
    ctx.beginPath(); const[gx]=toCanvas(v,0); const[,gy1]=toCanvas(0,PLOT.yMin); const[,gy2]=toCanvas(0,PLOT.yMax);
    ctx.moveTo(gx,gy2); ctx.lineTo(gx,gy1); ctx.stroke();
    // Horizontal
    ctx.beginPath(); const[gx1,gy]=toCanvas(PLOT.xMin,v); const[gx2]=toCanvas(PLOT.xMax,v);
    ctx.moveTo(gx1,gy); ctx.lineTo(gx2,gy); ctx.stroke();
  }

  // Axis tick labels
  ctx.fillStyle='#475569'; ctx.font='10px system-ui';
  for (let v=-20; v<=20; v+=10) {
    if (v===0) continue;
    const [x]=toCanvas(v,0);
    ctx.textAlign='center'; ctx.fillText(v, x, H-PAD+18);
    const [,y]=toCanvas(0,v);
    ctx.textAlign='right'; ctx.fillText(v, PAD-8, y+4);
  }

  // Axis titles
  ctx.fillStyle='#64748b'; ctx.font='bold 11px system-ui';
  ctx.textAlign='center';
  ctx.fillText('← Glove Side     Horizontal Break (in)     Arm Side →', W/2, H-6);
  ctx.save(); ctx.translate(14, H/2); ctx.rotate(-Math.PI/2);
  ctx.fillText('Induced Vertical Break (in)', 0, 0); ctx.restore();

  if (!Object.keys(pitcherData).length) return;

  // Individual pitch dots (faint)
  for (const [type, {pitches}] of Object.entries(pitcherData)) {
    const c = color(type);
    ctx.fillStyle = c+'30';
    for (const p of pitches) {
      const hb=num(p.HorzBreak), ivb=num(p.InducedVertBreak);
      if (hb==null||ivb==null) continue;
      const [x,y]=toCanvas(hb,ivb);
      ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
    }
  }

  // Average + perturbed dots
  for (const [type, {metrics:m}] of Object.entries(pitcherData)) {
    if (!m||m.hb==null||m.ivb==null) continue;
    const c = color(type);
    const isSel = type===state.selectedType;
    const [ax,ay] = toCanvas(m.hb, m.ivb);

    // Average dot
    ctx.beginPath(); ctx.arc(ax,ay,isSel?9:7,0,Math.PI*2);
    ctx.fillStyle=c; ctx.fill();
    ctx.strokeStyle='#0d1117'; ctx.lineWidth=1.5; ctx.stroke();

    // Label
    ctx.fillStyle='#f1f5f9';
    ctx.font=\`\${isSel?'bold ':' '}11px system-ui\`;
    ctx.textAlign='center';
    ctx.fillText(type, ax, ay-13);

    // Perturbed dot if applicable
    const per = state.perturbation[type]||{};
    const dIVB = per.ivb||0, dHB = per.hb||0;
    if (dIVB!==0||dHB!==0) {
      const [px,py]=toCanvas(m.hb+dHB, m.ivb+dIVB);
      // Dashed arrow
      ctx.save();
      ctx.strokeStyle=c; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(px,py); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      // Perturbed dot
      ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2);
      ctx.fillStyle=c+'66'; ctx.fill();
      ctx.strokeStyle=c; ctx.lineWidth=2; ctx.stroke();
      // Badge
      ctx.fillStyle='#f59e0b'; ctx.font='10px system-ui';
      ctx.textAlign='left';
      ctx.fillText('●', px+9, py-6);
    }
  }

  // Legend (top-left)
  let lx=PAD, ly=PAD-16;
  ctx.textAlign='left';
  for (const [type] of Object.entries(pitcherData)) {
    const c=color(type);
    ctx.fillStyle=c; ctx.fillRect(lx,ly-7,10,10);
    ctx.fillStyle=state.selectedType===type?'#f1f5f9':'#94a3b8';
    ctx.font=state.selectedType===type?'bold 10px system-ui':'10px system-ui';
    const w=ctx.measureText(type).width;
    ctx.fillText(type, lx+13, ly+2);
    lx+=w+28;
  }
}

// ── Trajectory helpers ───────────────────────────────────────
function getCoeffsFromPitch(p) {
  if (p.PitchTrajectoryXc0 && p.PitchTrajectoryXc0 !== '' && p.PitchTrajectoryXc0 !== 'NA') {
    return {
      Xc0:+p.PitchTrajectoryXc0, Xc1:+p.PitchTrajectoryXc1, Xc2:+p.PitchTrajectoryXc2,
      Yc0:+p.PitchTrajectoryYc0, Yc1:+p.PitchTrajectoryYc1, Yc2:+p.PitchTrajectoryYc2,
      Zc0:+p.PitchTrajectoryZc0, Zc1:+p.PitchTrajectoryZc1, Zc2:+p.PitchTrajectoryZc2,
    };
  }
  const vy0 = parseFloat(p.vy0);
  if (!isNaN(vy0) && vy0 !== 0) {
    return {
      Xc0:+(p.y0)||50, Xc1:+p.vy0,        Xc2:0.5*(+(p.ay0)||0),
      Yc0:+(p.z0)||6,  Yc1:+p.vz0,        Yc2:0.5*(+(p.az0)||0),
      Zc0:+(p.x0)||0,  Zc1:+p.vx0,        Zc2:0.5*(+(p.ax0)||0),
    };
  }
  return null;
}

function avgCoeffsForType(pitches) {
  const valid = pitches.map(getCoeffsFromPitch).filter(Boolean);
  if (!valid.length) return null;
  const keys = ['Xc0','Xc1','Xc2','Yc0','Yc1','Yc2','Zc0','Zc1','Zc2'];
  const out = {};
  for (const k of keys) out[k] = valid.reduce((s,c)=>s+c[k],0)/valid.length;
  return out;
}

function tAtDist(coeffs, dist) {
  const a=coeffs.Xc2, b=coeffs.Xc1, c=coeffs.Xc0-dist;
  if (Math.abs(a)<1e-9) return Math.abs(b)>1e-9 ? -c/b : null;
  const disc=b*b-4*a*c;
  if (disc<0) return null;
  const t1=(-b+Math.sqrt(disc))/(2*a), t2=(-b-Math.sqrt(disc))/(2*a);
  const valid=[t1,t2].filter(t=>t>0);
  return valid.length ? Math.min(...valid) : null;
}

function posAt(coeffs, t) {
  return {
    dist:   coeffs.Xc0 + coeffs.Xc1*t + coeffs.Xc2*t*t,
    height: coeffs.Yc0 + coeffs.Yc1*t + coeffs.Yc2*t*t,
    horiz:  coeffs.Zc0 + coeffs.Zc1*t + coeffs.Zc2*t*t,
  };
}

function trajectoryPoints(coeffs, n=120) {
  const tP = tAtDist(coeffs, 0);
  if (!tP) return [];
  const pts = [];
  for (let i=0; i<=n; i++) {
    const t = (i/n)*tP;
    const p = posAt(coeffs, t);
    pts.push(new THREE.Vector3(-p.horiz, p.height, p.dist));
  }
  return pts;
}

function perturbCoeffs(avgC, metrics, perturbation) {
  const c = {...avgC};
  const per = perturbation;

  // ── Spin efficiency → scale break magnitude (Magnus force ∝ efficiency)
  const effMult  = (per.spinEff && metrics.spinEff && metrics.spinEff > 0)
    ? Math.min(100, metrics.spinEff + per.spinEff) / metrics.spinEff : 1;
  const breakMult = effMult;

  // ── IVB delta → scale the Magnus (non-gravity) part of Yc2 ─────
  // Yc2 ≈ 0.5 * (a_magnus + a_gravity). Gravity contributes -16.1 ft/s² to Yc2.
  // If we scale the whole Yc2, we also scale gravity — which is why +IVB
  // was previously making pitches DROP MORE. Strip gravity, scale, add back.
  const GRAV_Yc2 = -16.1;
  const newIVB   = (metrics.ivb || 0) + (per.ivb || 0);
  const baseIVB  = metrics.ivb || 0;
  const baseMagY = avgC.Yc2 - GRAV_Yc2;  // Magnus-only part
  if (Math.abs(baseIVB) > 0.5) {
    c.Yc2 = baseMagY * (newIVB / baseIVB) * breakMult + GRAV_Yc2;
  } else {
    // Base IVB near zero — fall back to additive: ~0.47 ft/s² of Yc2 per inch IVB
    c.Yc2 = (baseMagY + 0.47 * (per.ivb || 0)) * breakMult + GRAV_Yc2;
  }

  // ── HB delta → horizontal acceleration term (Zc2). No gravity here.
  const newHB  = (metrics.hb || 0) + (per.hb || 0);
  const baseHB = metrics.hb || 0;
  if (Math.abs(baseHB) > 0.5) {
    c.Zc2 = avgC.Zc2 * (newHB / baseHB) * breakMult;
  } else {
    // Base HB near zero — additive fallback
    c.Zc2 = (avgC.Zc2 + 0.47 * (per.hb || 0)) * breakMult;
  }

  // ── Arm slot → shifts release point (Yc0 = height, Zc0 = horizontal)
  if (per.armSlot && metrics.relHeight != null && metrics.relSide != null) {
    const SHOULDER_H = 4.0;
    const h0 = metrics.relHeight - SHOULDER_H;
    const s0 = Math.abs(metrics.relSide);
    const armRadius = Math.sqrt(h0*h0 + s0*s0) || 1.5; // ft
    const oldAngle  = Math.atan2(h0, s0);
    const newAngle  = oldAngle + (per.armSlot * Math.PI/180);
    c.Yc0 = avgC.Yc0 + armRadius*(Math.sin(newAngle) - Math.sin(oldAngle));
    c.Zc0 = avgC.Zc0 + armRadius*(Math.cos(newAngle) - Math.cos(oldAngle))
                       * (metrics.hand==='L' ? 1 : -1);
  }

  return c;
}

// Track dynamic trajectory objects for cleanup
const trajectoryObjects = [];

function clearTrajectories() {
  for (const obj of trajectoryObjects) scene3d.remove(obj);
  trajectoryObjects.length = 0;
}

function addTrajectoryLine(pts, hexColor, opacity=1.0) {
  if (!pts.length) return;
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: hexColor, transparent: opacity<1, opacity });
  const line = new THREE.Line(geo, mat);
  scene3d.add(line);
  trajectoryObjects.push(line);
}

function addEndpointSphere(pt, hexColor) {
  const geo = new THREE.SphereGeometry(0.06, 10, 10);
  const mat = new THREE.MeshBasicMaterial({ color: hexColor });
  const sphere = new THREE.Mesh(geo, mat);
  sphere.position.copy(pt);
  scene3d.add(sphere);
  trajectoryObjects.push(sphere);
}

// Draw a cylinder-arm from p1 to p2 (used for arm angle viz)
function addArmCylinder(p1, p2, hexColor, opacity=1.0) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  if (len < 0.01) return;
  const geo = new THREE.CylinderGeometry(0.05, 0.08, len, 8);
  const mat = new THREE.MeshBasicMaterial({ color: hexColor, transparent: opacity < 1, opacity });
  const mesh = new THREE.Mesh(geo, mat);
  const mid = new THREE.Vector3().lerpVectors(p1, p2, 0.5);
  mesh.position.copy(mid);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  scene3d.add(mesh);
  trajectoryObjects.push(mesh);
  // Ball/glove sphere at release end
  const bGeo = new THREE.SphereGeometry(0.1, 8, 8);
  const bMat = new THREE.MeshBasicMaterial({ color: hexColor, transparent: opacity < 1, opacity });
  const ball = new THREE.Mesh(bGeo, bMat);
  ball.position.copy(p2);
  scene3d.add(ball);
  trajectoryObjects.push(ball);
}

function render3DScene() {
  clearTrajectories();
  for (const [type, {pitches, metrics}] of Object.entries(pitcherData)) {
    const avgC = avgCoeffsForType(pitches);
    if (!avgC) continue;
    const hex = parseInt(COLORS[type]?.replace('#','') || '94a3b8', 16);

    // Average trajectory
    const pts = trajectoryPoints(avgC);
    if (pts.length) {
      addTrajectoryLine(pts, hex);
      addEndpointSphere(pts[pts.length-1], hex);
    }

    // Perturbed trajectory if applicable
    const per = state.perturbation[type]||{};
    if (metrics && (per.ivb || per.hb || per.spinEff || per.armSlot)) {
      const pCoeffs = perturbCoeffs(avgC, metrics, per);
      const pPts = trajectoryPoints(pCoeffs);
      if (pPts.length) {
        addTrajectoryLine(pPts, hex, 0.45);
        addEndpointSphere(pPts[pPts.length-1], hex);
      }
    }
  }

  // ── Arm angle visualization (selected pitch type only) ──────
  if (state.selectedType && pitcherData[state.selectedType]) {
    const { pitches, metrics } = pitcherData[state.selectedType];
    const avgC = avgCoeffsForType(pitches);
    if (avgC && metrics) {
      const pts = trajectoryPoints(avgC);
      if (pts.length) {
        const hex = parseInt(COLORS[state.selectedType]?.replace('#','') || '94a3b8', 16);
        const releasePoint = pts[0];  // first point = release
        const shoulder = new THREE.Vector3(releasePoint.x * 0.3, 5.5, 60.5);  // body center, shoulder height

        // Original arm
        addArmCylinder(shoulder, releasePoint, hex, 1.0);

        // Perturbed arm (if arm angle was changed)
        const per = state.perturbation[state.selectedType] || {};
        if (per.armSlot) {
          const pCoeffs = perturbCoeffs(avgC, metrics, per);
          const pPts = trajectoryPoints(pCoeffs);
          if (pPts.length) {
            addArmCylinder(shoulder, pPts[0], hex, 0.4);
          }
        }
      }
    }
  }
}

async function loadFile(file) {
  return new Promise(res=>{ const r=new FileReader(); r.onload=e=>res(parseCSV(e.target.result)); r.readAsText(file); });
}

async function ingestFiles(files) {
  const arrays = await Promise.all(files.map(loadFile));
  const seen=new Set(); allPitches=[];
  for (const arr of arrays) for (const p of arr) {
    const uid=p.PitchUID||(p.Date+'_'+p.Time+'_'+p.Pitcher+'_'+p.PitchNo);
    if (!seen.has(uid)){seen.add(uid);allPitches.push(p);}
  }
  state.pitches=allPitches;
  populatePitchers();
  document.getElementById('load-status').textContent=\`✓ \${files.length} file(s) — \${allPitches.length} pitches\`;
  staffScores.clear();
  staffScoringDone = false;
  // Score all staff in background (non-blocking)
  scoreAllStaff();
  // Share with other tabs
  try { window.parent.postMessage({ type:'qub-csv', pitches:allPitches }, '*'); } catch(_){}
}
