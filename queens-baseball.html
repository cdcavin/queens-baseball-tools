    .panel-right{width:300px;background:#0f172a;border-left:1px solid #1e293b;overflow-y:auto}
    .center{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}
    /* mobile panel toggles (only <768px) */
    .mob-l-toggle,.mob-r-toggle{display:none;position:fixed;top:8px;z-index:200;width:38px;height:38px;background:#1e293b;border:1px solid #334155;border-radius:7px;color:#94a3b8;font-size:16px;cursor:pointer;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
    .mob-l-toggle{left:8px} .mob-r-toggle{right:8px}
    .mob-bd{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:149;-webkit-tap-highlight-color:transparent}
    .mob-bd.open{display:block}
    @media(max-width:767px){
      body{padding-bottom:env(safe-area-inset-bottom,0)}
      .mob-l-toggle,.mob-r-toggle{display:flex}
      .panel-left,.panel-right{position:fixed!important;top:0;bottom:0;z-index:150;transition:transform .25s ease;width:min(280px,82vw)!important;padding-bottom:env(safe-area-inset-bottom,0)}
      .panel-left{left:0;transform:translateX(-100%);border-right:1px solid #1e293b}
      .panel-right{right:0;transform:translateX(100%);border-left:1px solid #1e293b}
      .panel-left.open,.panel-right.open{transform:translateX(0)}
      .header{padding-left:54px;padding-right:54px;flex-wrap:wrap;gap:8px}
      #scene-cams{top:6px;bottom:auto!important;background:rgba(15,23,42,.85);backdrop-filter:blur(4px);border-radius:6px;padding:3px}
      .scam-btn{padding:6px 12px!important;font-size:12px!important}
    }

    /* ── Sections ── */
    .section{padding:10px 12px;border-bottom:1px solid #1e293b}
    .sec-title{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}

    /* ── Controls ── */
    select{width:100%;background:#1e293b;color:#cbd5e1;border:1px solid #334155;border-radius:4px;padding:5px 8px;font-size:12px;cursor:pointer}

    /* ── Arsenal rows ── */
    .arsenal-row{padding:7px 8px;border-radius:5px;margin-bottom:3px;background:#131722;border:1.5px solid transparent;cursor:pointer;transition:border-color .15s}
    .arsenal-row:hover{border-color:#3b82f640}
    .arsenal-row.selected{border-color:#3b82f6}
    .arsenal-row-hdr{display:flex;align-items:center;gap:6px}
    .a-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
    .a-name{font-size:12px;font-weight:600;flex:1;color:#cbd5e1}
    .a-count{font-size:9px;color:#64748b}
    .a-metrics{font-size:10px;color:#64748b;margin-top:3px;display:flex;flex-wrap:wrap;gap:6px}

    /* ── Canvas ── */
    .empty-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#334155;font-size:13px}

    /* ── Drop overlay ── */
    .drop-overlay{display:none;position:fixed;inset:0;background:#0d1117cc;z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:18px;color:#3b82f6;border:3px dashed #3b82f6}
    .drop-overlay.active{display:flex}

    /* ── Right panel ── */
    .comp-card{background:#131722;border:1px solid #1e293b;border-radius:6px;padding:10px;margin-bottom:8px;transition:border-color .2s}
    .comp-card:hover{border-color:#334155}
    .comp-card-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .comp-card-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:#3b82f6}
    .comp-card-name{font-size:13px;font-weight:700;color:#f1f5f9;flex:1}
    .comp-card-hand{font-size:10px;color:#64748b}
    .comp-sim{font-size:11px;font-weight:700;color:#3b82f6;white-space:nowrap}
    .comp-pitch-row{display:flex;align-items:center;gap:6px;padding:3px 0;border-radius:3px}
    .comp-pitch-row.anchor-match{background:#3b82f610;border-left:2px solid #3b82f6;padding-left:4px}
    .comp-pitch-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .comp-pitch-type{font-size:10px;font-weight:600;color:#94a3b8;width:44px}
    .comp-pitch-stats{font-size:10px;color:#64748b;flex:1}
    .comp-pitch-usage{font-size:9px;color:#475569;white-space:nowrap;font-variant-numeric:tabular-nums}

    .suggest-card{background:#131722;border:1px solid #1e293b;border-radius:6px;padding:10px;margin-bottom:8px;position:relative;cursor:pointer;transition:border-color .15s}
    .suggest-card:hover{border-color:#334155}
    .suggest-card.selected{border-color:#3b82f6;background:#3b82f608}
    .suggest-card-header{display:flex;align-items:center;gap:8px;margin-bottom:5px}
    .suggest-type-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;color:#0d1117}
    .suggest-label{font-size:9px;font-weight:700;color:#f59e0b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    .suggest-example{font-size:10px;color:#64748b;margin-bottom:3px;font-style:italic}
    .suggest-explain{font-size:10px;color:#94a3b8;line-height:1.4}
    .suggest-targets{font-size:9px;color:#475569;margin-top:4px}
    .suggest-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}

    .footnote{font-size:9px;color:#334155;padding:10px 12px;border-top:1px solid #1e293b;margin-top:auto}

    .loading-state{padding:20px;text-align:center;color:#475569;font-size:12px}
    .loading-dot{display:inline-block;animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

    .api-offline{background:#0d1117;border:1px solid #1e293b;border-radius:6px;padding:12px;text-align:center;color:#475569;font-size:11px;margin:8px 0}
    .api-offline strong{color:#334155;display:block;margin-bottom:4px;font-size:12px}

    /* Drag highlight on body */
    body.drag-over .drop-overlay{display:flex}

    /* Camera buttons */
    .scam-btn.active{background:#1e3a5f !important;color:#60a5fa !important;border-color:#3b82f6 !important}
  </style>
</head>
<body>
<button class="mob-l-toggle" id="mob-l-toggle" aria-label="Toggle left panel">☰</button>
<button class="mob-r-toggle" id="mob-r-toggle" aria-label="More info" style="font-size:18px">ⓘ</button>
<div class="mob-bd" id="mob-bd"></div>

<!-- Drop overlay -->
<div class="drop-overlay" id="drop-overlay">
  <div>Drop Trackman CSV here</div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-title">Queens Pitch Recommender</div>
  <label class="upload-btn">
    + Load Trackman CSV
    <input type="file" accept=".csv" id="csv-input" style="display:none" multiple/>
  </label>
  <label class="chk-row">
    <input type="checkbox" id="chk-queens" checked/> Queens Only
  </label>
  <span id="load-status">No CSV loaded</span>
</div>

<!-- Main layout -->
<div class="main">

  <!-- Left: pitcher + arsenal -->
  <div class="panel panel-left">
    <div class="section">
      <div class="sec-title">Pitcher</div>
      <select id="pitcher-sel"><option value="">— load CSV —</option></select>
    </div>
    <div class="section" style="flex:1;min-height:0;overflow-y:auto">
      <div class="sec-title">Arsenal — click to set anchor</div>
      <div id="arsenal-list"><p style="font-size:11px;color:#334155">No data loaded</p></div>
    </div>
  </div>

  <!-- Center: movement plot + 3D scene -->
  <div class="center">
    <div id="plot-wrap" style="height:55%;min-height:0;position:relative;overflow:hidden">
      <div class="empty-state" id="empty-state">Load a Trackman CSV to begin</div>
      <canvas id="plot-canvas" style="display:none;position:absolute;inset:0;width:100%;height:100%"></canvas>
    </div>
    <div style="height:2px;background:#1e293b;flex-shrink:0"></div>
    <div id="scene-wrap" style="height:45%;min-height:0;position:relative;overflow:hidden;background:#0d1117">
      <canvas id="scene-canvas" style="display:block;width:100%;height:100%"></canvas>
      <div id="scene-cams" style="position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:10"></div>
      <div id="scene-empty" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#1e293b;font-size:12px">Click a suggestion to see trajectory</div>
    </div>
  </div>

  <!-- Right: comp results -->
  <div class="panel panel-right">
    <div class="section">
      <div class="sec-title">Closest MLB Comps</div>
      <div id="comps-section">
        <div class="api-offline">
          <strong>No anchor selected</strong>
          Click a pitch type to find MLB comps
        </div>
      </div>
    </div>
    <div class="section">
      <div class="sec-title">Consider Adding</div>
      <div id="suggest-section">
        <div class="api-offline">
          <strong>No anchor selected</strong>
          Select an anchor pitch to see suggestions
        </div>
      </div>
    </div>
    <div class="footnote">Comps from 2023–24 MLB Statcast · Same handedness only</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>
<script type="module">

const RecommenderApp = (() => {

// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════
const API_URL = 'https://cdcavin-queens-api.hf.space';

const COLORS = {
  FF:'#ef4444', SI:'#f97316', FC:'#eab308',
  SL:'#8b5cf6', CU:'#3b82f6', CH:'#10b981',
  FS:'#06b6d4', ST:'#ec4899', KC:'#6b7280', KN:'#94a3b8',
  // also by full name for convenience
  Fastball:'#ef4444', Sinker:'#f97316', Cutter:'#eab308',
  Slider:'#8b5cf6', Curveball:'#3b82f6', ChangeUp:'#10b981',
  Splitter:'#06b6d4', Sweeper:'#ec4899', Knuckleball:'#6b7280',
};

const TO_SC = {
  Fastball:'FF', Sinker:'SI', Cutter:'FC', Slider:'SL',
  Curveball:'CU', ChangeUp:'CH', Splitter:'FS', Sweeper:'ST',
  Knuckleball:'KC',
};
const FROM_SC = Object.fromEntries(Object.entries(TO_SC).map(([k,v])=>[v,k]));

const QUEENS_ARSENAL = {
  ruller:    ['Fastball','Sinker','Slider','Cutter','ChangeUp'],
  eagen:     ['Fastball','Sinker','Slider','Curveball','ChangeUp'],
  gowan:     ['Fastball','Sinker','Slider','ChangeUp','Curveball'],
  quezada:   ['Fastball','Sinker','Slider','Cutter','Curveball','ChangeUp'],
  young:     ['Fastball','Slider','Cutter','ChangeUp'],
  shipman:   ['Fastball','Sinker','Slider','Curveball','ChangeUp'],
  pollard:   ['Fastball','Curveball','Cutter'],
  joseph:    ['Sinker','Fastball','Slider','ChangeUp'],
  booker:    ['Fastball','Curveball','ChangeUp'],
  clevidence:['Fastball','Curveball','ChangeUp'],
  martino:   ['Fastball','Curveball','Cutter','Knuckleball'],
  hudson:    ['Fastball','Slider','ChangeUp'],
  green:     ['Fastball','Sinker','Slider','ChangeUp'],
  jones:     ['Fastball','Sinker','Curveball','ChangeUp','Slider'],
  neave:     ['Sinker','Slider','ChangeUp'],
  brodeur:   ['Fastball','Slider','ChangeUp'],
  savona:    ['Fastball','Curveball'],
};

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let allPitches = [];
const state = {
  pitches: [], pitcherId: null, selectedType: null, queensOnly: true
};
let pitcherData = {};
let currentComps = null;
let selectedSuggestion = null; // { pitch, sc, pitcherComp, fullName }

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
const avg = arr => arr.length ? arr.reduce((s,v)=>s+v,0)/arr.length : null;
const clr = t => COLORS[t] || '#94a3b8';
const fmt1 = v => v != null ? v.toFixed(1) : '—';

function normalizePitchType(t) {
  if (!t || t==='Unknown') return 'Unknown';
  const l = t.toLowerCase().replace(/[\\s_-]/g,'');
  if (l.includes('fourseam')||l==='fastball'||l==='4seam') return 'Fastball';
  if (l.includes('twoseam')||l==='sinker') return 'Sinker';
  if (l.includes('changeup')||l.includes('change')) return 'ChangeUp';
  if (l.includes('curveball')||l.includes('curve')) return 'Curveball';
  if (l.includes('sweeper')) return 'Sweeper';
  if (l.includes('slider')) return 'Slider';
  if (l.includes('cutter')) return 'Cutter';
  if (l.includes('splitter')||l.includes('split')) return 'Splitter';
  if (l.includes('knuckle')) return 'Knuckleball';
  return t;
}

function isQueens(p) {
  const t = (p.PitcherTeam||'').toLowerCase();
  return t.includes('qun')||t.includes('quc')||t.includes('queens')||t.includes('ryl')||t==='';
}

function getWhitelist(pitches, pitcherId) {
  const p = pitches.find(p=>p.PitcherId===pitcherId);
  if (!p) return null;
  const name = (p.Pitcher||'').toLowerCase();
  for (const [k,v] of Object.entries(QUEENS_ARSENAL))
    if (name.includes(k)) return new Set(v);
  return null;
}

function getPitchTypes(pitches, pitcherId) {
  const wl = getWhitelist(pitches, pitcherId);
  const counts = {};
  let total = 0;
  for (const p of pitches) {
    if (p.PitcherId!==pitcherId||!p.pitchType||p.pitchType==='Unknown') continue;
    counts[p.pitchType] = (counts[p.pitchType]||0)+1;
    total++;
  }
  if (wl) return Object.entries(counts).filter(([t])=>wl.has(t)).sort((a,b)=>b[1]-a[1]).map(([t])=>t);
  const MIN=5, PCT=0.03;
  return Object.entries(counts).filter(([,c])=>c>=MIN&&c/total>=PCT).sort((a,b)=>b[1]-a[1]).map(([t])=>t);
}

// ═══════════════════════════════════════════════════════════════
// CSV PARSING
// ═══════════════════════════════════════════════════════════════
function parseCSV(text) {
  const res = window.Papa.parse(text, { header:true, dynamicTyping:false, skipEmptyLines:true });
  return res.data.filter(row => !String(row.Pitcher||'').toLowerCase().includes('keontay')).map(row => {
    const tagged = row.TaggedPitchType, auto = row.AutoPitchType;
    const rawType = (tagged&&tagged!=='Undefined'&&tagged!=='')?tagged:
                    (auto&&auto!=='Undefined'&&auto!=='')?auto:'Unknown';
    const pid = String(row.PitcherId||'');
    return { ...row, PitcherId: pid, pitchType: normalizePitchType(rawType) };
  });
}

// ═══════════════════════════════════════════════════════════════
// METRIC COMPUTATION
// ═══════════════════════════════════════════════════════════════
const PITCHER_HEIGHTS_IN = {
  quezada:74, gowan:71, shipman:73, neave:75, jones:73, young:74,
  clevidence:73, eagen:74, pollard:76, martino:74, joseph:74,
  savona:76, brodeur:78, hudson:76, ruller:74, 'booker, avery':73, green:71,
};
function lookupPitcherHeightFt(pitcherName) {
  if (!pitcherName) return null;
  const lower = String(pitcherName).toLowerCase();
  for (const k in PITCHER_HEIGHTS_IN) if (lower.includes(k)) return PITCHER_HEIGHTS_IN[k] / 12;
  return null;
}
function computeArmSlot(relHeight, relSide, hand, pitcherName) {
  if (relHeight==null||relSide==null) return null;
  const heightFt = lookupPitcherHeightFt(pitcherName);
  // Matches R app: atan2(|RelSide|, RelHeight - pivot), pivot = height_ft * 0.43
  const pivot = heightFt != null ? heightFt * 0.43 : (73/12) * 0.43;
  const dh = relHeight - pivot;
  const ds = Math.abs(relSide);
  return Math.atan2(ds, dh) * (180/Math.PI);
}

function pitchMetrics(pitches) {
  if (!pitches.length) return null;
  const hand = pitches[0]?.PitcherThrows||'R';
  const vals = k => pitches.map(p=>num(p[k])).filter(v=>v!=null);
  const veloArr = vals('RelSpeed');
  const ivbArr  = vals('InducedVertBreak');
  const hbArr   = vals('HorzBreak');
  const spinArr = vals('SpinRate');
  const rhArr   = vals('RelHeight');
  const rsArr   = vals('RelSide');
  const avgRH = avg(rhArr), avgRS = avg(rsArr);
  const pitcherName = pitches[0]?.Pitcher || '';
  const armSlot = computeArmSlot(avgRH, avgRS, hand, pitcherName);
  return {
    hand, count: pitches.length,
    velo:      avg(veloArr),
    ivb:       avg(ivbArr),
    hb:        avg(hbArr),
    spin:      avg(spinArr),
    relHeight: avgRH,
    relSide:   avgRS,
    armSlot,
  };
}

// ═══════════════════════════════════════════════════════════════
// PITCHER DATA
// ═══════════════════════════════════════════════════════════════
function buildPitcherData(id) {
  const types = getPitchTypes(state.pitches, id);
  pitcherData = {};
  for (const type of types) {
    const ps = state.pitches.filter(p=>p.PitcherId===id&&p.pitchType===type);
    pitcherData[type] = { pitches: ps, metrics: pitchMetrics(ps) };
  }
}

// ═══════════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════════
async function findComps(anchorType, metrics) {
  const sc = TO_SC[anchorType];
  if (!sc) return null;
  const isLefty = metrics.hand==='L'||metrics.hand==='Left'||metrics.hand==='LHP';
  const p_throws = isLefty ? 'L' : 'R';
  try {
    const resp = await fetch(\`\${API_URL}/find_comps\`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        pitch_type: sc,
        ivb: metrics.ivb,
        hb_sym: metrics.hb,   // Trackman HorzBreak is arm-side positive already
        velo: metrics.velo,
        arm_angle: metrics.armSlot,
        p_throws,
      })
    });
    if (!resp.ok) return null;
    return await resp.json();
  } catch(e) {
    console.warn('API unavailable:', e.message);
    return null;
  }
}

// ═══════════════════════════════════════════════════════════════
// PITCHER SELECTOR
// ═══════════════════════════════════════════════════════════════
function populatePitchers() {
  const sel = document.getElementById('pitcher-sel');
  const seen = new Map();
  for (const p of state.pitches) {
    if (state.queensOnly && !isQueens(p)) continue;
    if (p.PitcherId && !seen.has(p.PitcherId))
      seen.set(p.PitcherId, { id:p.PitcherId, name:p.Pitcher||p.PitcherId, throws:p.PitcherThrows||'' });
  }
  const pitchers = Array.from(seen.values()).sort((a,b)=>a.name.localeCompare(b.name));
  sel.innerHTML = '<option value="">— select pitcher —</option>';
  pitchers.forEach(p => {
    const o = document.createElement('option');
    o.value = p.id; o.textContent = \`\${p.name} (\${p.throws})\`;
    sel.appendChild(o);
  });
}

// ═══════════════════════════════════════════════════════════════
// ARSENAL LIST
// ═══════════════════════════════════════════════════════════════
function renderArsenal() {
  const el = document.getElementById('arsenal-list');
  const types = Object.keys(pitcherData);
  if (!types.length) { el.innerHTML='<p style="font-size:11px;color:#334155">No pitch data</p>'; return; }
  el.innerHTML = '';
  for (const type of types) {
    const m = pitcherData[type].metrics;
    if (!m) continue;
    const c = clr(type);
    const isSel = state.selectedType===type;
    const row = document.createElement('div');
    row.className = 'arsenal-row'+(isSel?' selected':'');
    row.innerHTML = \`
      <div class="arsenal-row-hdr">
        <span class="a-dot" style="background:\${c}"></span>
        <span class="a-name">\${type}</span>
        <span class="a-count">(\${m.count})</span>
        \${isSel?'<span style="font-size:9px;color:#3b82f6;font-weight:700">ANCHOR</span>':''}
      </div>
      <div class="a-metrics">
        \${m.velo!=null?\`<span>\${m.velo.toFixed(1)} mph</span>\`:''}
        \${m.ivb!=null?\`<span>IVB \${m.ivb.toFixed(1)}"</span>\`:''}
        \${m.hb!=null?\`<span>HB \${m.hb.toFixed(1)}"</span>\`:''}
      </div>\`;
    row.addEventListener('click', () => {
      state.selectedType = type;
      currentComps = null;
      selectedSuggestion = null;
      render3DScene();
      renderArsenal();
      drawPlot();
      fetchAndRenderComps();
    });
    el.appendChild(row);
  }
}

// ═══════════════════════════════════════════════════════════════
// FETCH AND RENDER
// ═══════════════════════════════════════════════════════════════
async function fetchAndRenderComps() {
  if (!state.selectedType || !pitcherData[state.selectedType]) return;
  const m = pitcherData[state.selectedType].metrics;
  if (!m) return;

  // Show loading
  document.getElementById('comps-section').innerHTML = \`
    <div class="loading-state">
      <span class="loading-dot">Finding comps</span><span class="loading-dot" style="animation-delay:.2s">.</span><span class="loading-dot" style="animation-delay:.4s">.</span><span class="loading-dot" style="animation-delay:.6s">.</span>
    </div>\`;
  document.getElementById('suggest-section').innerHTML = \`<div class="loading-state" style="color:#475569">Waiting for comps…</div>\`;

  const result = await findComps(state.selectedType, m);

  if (!result) {
    document.getElementById('comps-section').innerHTML = \`
      <div class="api-offline">
        <strong>API unavailable</strong>
        Start the R Plumber API at localhost:8000 to see MLB comps
      </div>\`;
    document.getElementById('suggest-section').innerHTML = \`
      <div class="api-offline">
        <strong>API unavailable</strong>
        Suggestions require comp data
      </div>\`;
    // Still draw plot with queens data
    drawPlot([], []);
    return;
  }

  // API returns a bare array; normalise to {comps:[...]} for the rest of the UI
  const compsObj = Array.isArray(result) ? { comps: result } : result;
  currentComps = compsObj;
  renderComps(compsObj);
  drawPlot(compsObj.comps || [], buildSuggestions(compsObj));
}

// ═══════════════════════════════════════════════════════════════
// SUGGESTIONS LOGIC
// ═══════════════════════════════════════════════════════════════
function buildSuggestions(compsData) {
  if (!state.selectedType || !pitcherData[state.selectedType]) return [];
  const anchor = pitcherData[state.selectedType].metrics;
  if (!anchor) return [];

  const queensTypes = new Set(Object.keys(pitcherData));
  const comps = compsData.comps || [];
  if (!comps.length) return [];

  // Handedness: LHP arm-side = negative in Trackman/plot convention
  const isLHP = anchor.hand === 'L' || anchor.hand === 'Left' || anchor.hand === 'LHP';
  const hbSign = isLHP ? -1 : 1;  // flip hb_sym → catcher-view for plot + scoring

  // Build full Queens arsenal array for contrast scoring
  const queensArsenal = Object.entries(pitcherData)
    .map(([type, data]) => ({ ivb: data.metrics?.ivb, hb: data.metrics?.hb, type }))
    .filter(a => a.ivb != null && a.hb != null);

  // Convert Queens pitch types to Statcast codes for exact-match filtering
  const queensSC = new Set(Object.keys(pitcherData).map(t => TO_SC[t]).filter(Boolean));

  // Hard arm-angle gate: only suggest pitches from comps within ±4° of the Queens pitcher
  const queensArm = anchor.armSlot;
  const armOK = (p) => {
    if (queensArm == null || p.arm_angle == null) return true; // no data → don't filter
    return Math.abs(p.arm_angle - queensArm) <= 4;
  };

  // Pitch types that should never be suggested
  const NEVER_SUGGEST = new Set(['KC', 'KN', 'EP', 'SC', 'CS', 'FO', 'PO', 'UN']);

  // Phase 1: pitch types the pitcher does NOT throw at all (use all 5 comps)
  const candidateMap = new Map();
  for (const comp of comps) {
    for (const pitch of (comp.arsenal || [])) {
      if (!pitch.ivb || !pitch.hb_sym) continue;
      if (!armOK(pitch)) continue;                      // ±4° arm angle gate
      const compTotal = (comp.arsenal || []).reduce((s, p) => s + (p.n || 0), 0);
      if (compTotal > 0 && (pitch.n || 0) / compTotal < 0.10) continue; // <10% usage → skip
      const fullName = FROM_SC[pitch.pitch_type] || pitch.pitch_type;
      const key = pitch.pitch_type;
      if (queensSC.has(key)) continue;                  // pitcher already throws this type
      if (NEVER_SUGGEST.has(key)) continue;             // never suggest knuckleball/exotic types
      if (candidateMap.has(key)) continue;
      candidateMap.set(key, {
        sc: key, fullName,
        ivb: (pitch.ivb    ?? 0) * 12,
        hb: -(pitch.hb_sym ?? 0) * 12 * hbSign,  // Statcast sym: neg=arm-side → flip to match Trackman
        velo: pitch.velo,
        pitcherName: comp.player_name || 'MLB comp',
        contrast: scoreContrast(queensArsenal, pitch, isLHP),
        pitchData: pitch,
        comp,
      });
    }
  }

  let candidates = Array.from(candidateMap.values())
    .sort((a,b) => b.contrast.score - a.contrast.score);

  // Phase 2 fallback: if fewer than 3 unique new types, also consider same-type pitches
  // with very different movement profiles (e.g., a sweeper from a comp when they throw a slider)
  if (candidates.length < 3) {
    const anchorSC = TO_SC[state.selectedType];
    const fallbackMap = new Map();
    for (const comp of comps) {
      for (const pitch of (comp.arsenal || [])) {
        if (!pitch.ivb || !pitch.hb_sym) continue;
        if (!armOK(pitch)) continue;                    // ±4° arm angle gate
        const compTotal = (comp.arsenal || []).reduce((s, p) => s + (p.n || 0), 0);
        if (compTotal > 0 && (pitch.n || 0) / compTotal < 0.10) continue; // <10% usage → skip
        if (pitch.pitch_type === anchorSC) continue;    // skip the anchor type itself
        if (NEVER_SUGGEST.has(pitch.pitch_type)) continue; // no knuckleball/exotic types
        const key = pitch.pitch_type + '_' + comp.player_name;
        if (fallbackMap.has(key)) continue;
        const contrast = scoreContrast(queensArsenal, pitch);
        if (contrast.score < 6) continue;               // must be meaningfully different
        const fullName = (FROM_SC[pitch.pitch_type] || pitch.pitch_type)
                       + ' (' + (comp.player_name || 'MLB').split(',')[0].trim() + ')';
        fallbackMap.set(key, {
          sc: pitch.pitch_type, fullName,
          ivb: (pitch.ivb    ?? 0) * 12,
          hb: -(pitch.hb_sym ?? 0) * 12 * hbSign,  // Statcast sym: neg=arm-side → flip
          velo: pitch.velo,
          pitcherName: comp.player_name || 'MLB comp',
          contrast, pitchData: pitch, comp,
        });
      }
    }
    const extras = Array.from(fallbackMap.values())
      .sort((a,b) => b.contrast.score - a.contrast.score);
    // Merge, avoiding exact duplicates already in candidates
    const existingSC = new Set(candidates.map(c => c.sc));
    for (const e of extras) {
      if (candidates.length >= 3) break;
      if (!existingSC.has(e.sc)) { candidates.push(e); existingSC.add(e.sc); }
    }
  }

  return candidates.slice(0, 3);
}

function scoreContrast(queensArsenal, pitch, isLHP = false) {
  const hbSign = isLHP ? -1 : 1;
  const pIVB = (pitch.ivb    ?? 0) * 12;
  const pHB  = -(pitch.hb_sym ?? 0) * 12 * hbSign; // Statcast sym: neg=arm-side → flip to Trackman

  // Find the closest pitch in the Queens arsenal (Euclidean in movement space)
  let minDist = Infinity;
  let closest = null;
  for (const a of queensArsenal) {
    const d = Math.sqrt(((pIVB - a.ivb) / 4) ** 2 + ((pHB - a.hb) / 4) ** 2);
    if (d < minDist) { minDist = d; closest = a; }
  }

  // Score = movement gap from nearest arsenal pitch (equal weight on IVB & HB)
  const score = minDist * 10;

  // Label based on dominant direction of contrast vs closest arsenal pitch
  const aIVB = closest?.ivb ?? 0;
  const aHB  = closest?.hb  ?? 0;
  const ivbDelta = pIVB - aIVB;
  const hbDelta  = pHB  - aHB;

  let label, explain;
  const vertDom = Math.abs(ivbDelta) >= Math.abs(hbDelta);

  if (vertDom) {
    if (ivbDelta < -5) {
      label = 'North/South contrast';
      explain = \`Drops through a lower plane than your current pitches — different vertical approach angle.\`;
    } else if (ivbDelta > 5) {
      label = 'High-ride option';
      explain = \`More rise than anything in your arsenal — attacks the top of the zone differently.\`;
    } else {
      label = 'Vertical contrast';
      explain = \`Creates a distinct approach angle through the vertical zone.\`;
    }
  } else {
    if (Math.sign(pHB) !== Math.sign(aHB) && Math.abs(pHB) > 4) {
      label = 'East/West contrast';
      explain = \`Breaks opposite direction — forces hitters to cover both sides of the plate.\`;
    } else if (Math.abs(hbDelta) > 5) {
      label = 'Horizontal contrast';
      explain = \`More movement across the plate than your current arsenal — different tunnel point.\`;
    } else {
      label = 'Movement gap filler';
      explain = \`Occupies a movement zone your arsenal doesn't currently cover.\`;
    }
  }

  return { score, label, explain };
}

// ═══════════════════════════════════════════════════════════════
// RENDER COMPS (Right Panel)
// ═══════════════════════════════════════════════════════════════
function renderComps(data) {
  const comps = data.comps || [];
  const el = document.getElementById('comps-section');

  if (!comps.length) {
    el.innerHTML = '<div class="api-offline"><strong>No comps found</strong>Not enough data for this pitch type/handedness combo.</div>';
    document.getElementById('suggest-section').innerHTML = '<div class="api-offline"><strong>No suggestions</strong>Comps required to generate suggestions.</div>';
    return;
  }

  const anchorSC = TO_SC[state.selectedType] || '';
  const html = comps.slice(0, 3).map((comp, i) => {
    const dist = comp.anchor_dist ?? 0;
    const sim  = Math.round(100 * Math.exp(-0.18 * dist));
    const simColor = sim >= 80 ? '#22c55e' : sim >= 60 ? '#60a5fa' : '#f59e0b';
    const arsenal = comp.arsenal || [];

    const pitchRows = arsenal.map(pitch => {
      const isAnchor = pitch.pitch_type === anchorSC;
      const pitchColor = COLORS[pitch.pitch_type] || '#94a3b8';
      const fullN = FROM_SC[pitch.pitch_type] || pitch.pitch_type;
      const totalN = arsenal.reduce((s, p) => s + (p.n || 0), 0);
      const usagePct = totalN > 0 ? Math.round((pitch.n || 0) / totalN * 100) : null;
      const usageStr = usagePct != null ? \`\${usagePct}%\` : '';
      return \`<div class="comp-pitch-row\${isAnchor?' anchor-match':''}">
        <span class="comp-pitch-dot" style="background:\${pitchColor}"></span>
        <span class="comp-pitch-type">\${fullN}</span>
        <span class="comp-pitch-stats">\${fmt1(pitch.velo)}mph  IVB:\${fmt1((pitch.ivb??0)*12)}"  HB:\${fmt1((pitch.hb_sym??0)*12)}"</span>
        <span class="comp-pitch-usage">\${usageStr}</span>
      </div>\`;
    }).join('');

    const hand = comp.p_throws || comp.throws || 'R';
    return \`<div class="comp-card">
      <div class="comp-card-header">
        <span class="comp-card-dot" style="background:\${simColor}"></span>
        <span class="comp-card-name">\${comp.player_name || \`Comp \${i+1}\`}</span>
        <span class="comp-card-hand">\${hand}HP</span>
        <span class="comp-sim">\${sim}%</span>
      </div>
      \${pitchRows}
    </div>\`;
  }).join('');

  el.innerHTML = html;

  // Now render suggestions
  const suggestions = buildSuggestions(data);
  renderSuggestions(suggestions);
}

function renderSuggestions(suggestions) {
  const el = document.getElementById('suggest-section');
  if (!suggestions.length) {
    el.innerHTML = '<div class="api-offline"><strong>No new pitch types found</strong>Top comps share the same arsenal profile.</div>';
    return;
  }

  el.innerHTML = '';
  for (const s of suggestions) {
    const color = COLORS[s.sc] || COLORS[s.fullName] || '#94a3b8';
    const { label, explain } = s.contrast;
    const isSelected = selectedSuggestion && selectedSuggestion.sc === s.sc;

    const card = document.createElement('div');
    card.className = 'suggest-card' + (isSelected ? ' selected' : '');
    card.innerHTML = \`
      <div class="suggest-card-header">
        <span class="suggest-type-badge" style="background:\${color}">\${s.fullName}</span>
      </div>
      <div class="suggest-label">\${label}</div>
      <div class="suggest-example">like \${s.pitcherName}'s \${s.fullName}</div>
      <div class="suggest-explain">\${explain}</div>
      <div class="suggest-targets">
        <span class="suggest-dot" style="background:\${color}"></span>
        Target: IVB \${fmt1(s.ivb)}" · HB \${fmt1(s.hb)}" · ~\${fmt1(s.velo)} mph
      </div>\`;

    card.addEventListener('click', () => {
      selectedSuggestion = {
        pitch: s.pitchData,
        sc: s.sc,
        pitcherComp: s.comp,
        fullName: s.fullName,
      };
      // Highlight selected card
      document.querySelectorAll('.suggest-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      render3DScene();
      drawPlot(currentComps?.comps || [], buildSuggestions(currentComps));
    });

    el.appendChild(card);
  }
}

// ═══════════════════════════════════════════════════════════════
// MOVEMENT PLOT (Canvas 2D)
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('plot-canvas');
const ctx    = canvas.getContext('2d');
const PAD    = 52;
const PLOT   = { xMin:-25, xMax:25, yMin:-25, yMax:25 };

// Pulsing animation state
let pulsePhase = 0;
let animFrameId = null;

function toCanvas(hb, ivb) {
  const w = canvas.width - PAD*2, h = canvas.height - PAD*2;
  return [
    PAD + ((hb - PLOT.xMin)/(PLOT.xMax - PLOT.xMin))*w,
    PAD + (1 - (ivb - PLOT.yMin)/(PLOT.yMax - PLOT.yMin))*h,
  ];
}


function drawPlot(comps, suggestions) {
  // Cancel any running animation
  if (animFrameId) cancelAnimationFrame(animFrameId);

  const wrap = canvas.parentElement;
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;

  // Check if we have data
  const hasData = Object.keys(pitcherData).length > 0;
  const emptyState = document.getElementById('empty-state');
  if (!hasData) {
    canvas.style.display = 'none';
    emptyState.style.display = '';
    return;
  }
  canvas.style.display = 'block';
  emptyState.style.display = 'none';

  const _comps = comps || [];
  const _sugg  = suggestions || [];

  function frame() {
    pulsePhase = (pulsePhase + 0.05) % (Math.PI * 2);
    render(_comps, _sugg);
    if (_sugg.length) {
      animFrameId = requestAnimationFrame(frame);
    }
  }

  function render(comps, suggestions) {
    const W = canvas.width, H = canvas.height;
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, W, H);

    // Grid
    ctx.lineWidth = 1;
    for (let v = -20; v <= 20; v += 5) {
      const alpha = v===0 ? '#334155' : '#1e293b';
      ctx.strokeStyle = alpha;
      ctx.beginPath();
      const [gx]    = toCanvas(v, 0);
      const [,gy1]  = toCanvas(0, PLOT.yMin);
      const [,gy2]  = toCanvas(0, PLOT.yMax);
      ctx.moveTo(gx, gy2); ctx.lineTo(gx, gy1); ctx.stroke();
      ctx.beginPath();
      const [gx1, gy] = toCanvas(PLOT.xMin, v);
      const [gx2]     = toCanvas(PLOT.xMax, v);
      ctx.moveTo(gx1, gy); ctx.lineTo(gx2, gy); ctx.stroke();
    }

    // Axis tick labels
    ctx.fillStyle = '#475569'; ctx.font = '10px system-ui';
    for (let v = -20; v <= 20; v += 10) {
      if (v===0) continue;
      const [x] = toCanvas(v, 0);
      ctx.textAlign = 'center'; ctx.fillText(v, x, H - PAD + 18);
      const [,y] = toCanvas(0, v);
      ctx.textAlign = 'right'; ctx.fillText(v, PAD - 8, y + 4);
    }

    // Axis titles
    ctx.fillStyle = '#64748b'; ctx.font = 'bold 11px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('← Glove Side     Horizontal Break (in)     Arm Side →', W/2, H - 6);
    ctx.save(); ctx.translate(14, H/2); ctx.rotate(-Math.PI/2);
    ctx.fillText('Induced Vertical Break (in)', 0, 0); ctx.restore();

    // Individual pitch dots (faint)
    for (const [type, {pitches}] of Object.entries(pitcherData)) {
      const c = clr(type);
      ctx.fillStyle = c + '28';
      for (const p of pitches) {
        const hb  = num(p.HorzBreak), ivb = num(p.InducedVertBreak);
        if (hb==null||ivb==null) continue;
        const [x,y] = toCanvas(hb, ivb);
        ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fill();
      }
    }

    // Suggestion rings (pulsing dashed circles, or bright solid ring if selected)
    const pulse = (Math.sin(pulsePhase) + 1) / 2; // 0..1
    for (const s of suggestions) {
      if (s.ivb == null || s.hb == null) continue;
      const [x, y] = toCanvas(s.hb, s.ivb);
      const color = COLORS[s.sc] || COLORS[s.fullName] || '#94a3b8';
      const isSelSugg = selectedSuggestion && selectedSuggestion.sc === s.sc;

      if (isSelSugg) {
        // Bright solid ring for selected suggestion
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, 20, 0, Math.PI * 2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.5;
        ctx.stroke();
        // Second outer ring for emphasis
        ctx.beginPath();
        ctx.arc(x, y, 26, 0, Math.PI * 2);
        ctx.strokeStyle = color + '66';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      } else {
        // Pulsing dashed ring
        const radius = 16 + pulse * 6;
        const alpha  = Math.round((0.4 + pulse * 0.35) * 255).toString(16).padStart(2,'0');
        ctx.save();
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.strokeStyle = color + alpha;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }

      // + label
      ctx.fillStyle = isSelSugg ? color : color + 'cc';
      ctx.font = isSelSugg ? 'bold 14px system-ui' : 'bold 13px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('+', x, y + 5);

      // Type label above
      const labelRadius = isSelSugg ? 30 : (16 + pulse * 6);
      ctx.fillStyle = isSelSugg ? color : color + 'cc';
      ctx.font = isSelSugg ? 'bold 9px system-ui' : '9px system-ui';
      ctx.fillText(s.fullName, x, y - labelRadius - 4);
    }

    // Queens average dots (on top of comp dots)
    for (const [type, {metrics:m}] of Object.entries(pitcherData)) {
      if (!m||m.hb==null||m.ivb==null) continue;
      const c = clr(type);
      const isSel = type === state.selectedType;
      const [ax, ay] = toCanvas(m.hb, m.ivb);

      ctx.beginPath(); ctx.arc(ax, ay, isSel ? 10 : 7, 0, Math.PI*2);
      ctx.fillStyle = c; ctx.fill();
      ctx.strokeStyle = isSel ? '#ffffff' : '#0d1117';
      ctx.lineWidth = isSel ? 2.5 : 1.5;
      ctx.stroke();

      ctx.fillStyle = '#f1f5f9';
      ctx.font = \`\${isSel ? 'bold ' : ''}11px system-ui\`;
      ctx.textAlign = 'center';
      ctx.fillText(type, ax, ay - (isSel ? 15 : 12));
    }

    // Legend (top-left)
    let lx = PAD, ly = PAD - 16;
    ctx.textAlign = 'left';
    for (const [type] of Object.entries(pitcherData)) {
      const c = clr(type);
      ctx.fillStyle = c; ctx.fillRect(lx, ly - 7, 10, 10);
      ctx.fillStyle = state.selectedType===type ? '#f1f5f9' : '#94a3b8';
      ctx.font = state.selectedType===type ? 'bold 10px system-ui' : '10px system-ui';
      const tw = ctx.measureText(type).width;
      ctx.fillText(type, lx + 13, ly + 2);
      lx += tw + 28;
    }

    // Comp legend (bottom-right)
    if (comps.length) {
      const lrx = W - PAD - 4;
      const lry = H - PAD + 14;
      // Diamond for comps
      ctx.save();
      drawDiamond(lrx - 120, lry - 3, 5, '#94a3b8aa');
      ctx.fillStyle = '#64748b';
      ctx.font = '9px system-ui';
      ctx.textAlign = 'left';
      ctx.fillText('MLB comp pitch', lrx - 112, lry + 1);
      ctx.restore();
    }
    if (suggestions.length) {
      const lrx = W - PAD - 4;
      const lry = H - PAD + 14;
      ctx.save();
      ctx.setLineDash([4,3]);
      ctx.beginPath();
      ctx.arc(lrx - 15, lry - 3, 7, 0, Math.PI*2);
      ctx.strokeStyle = '#94a3b855';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#64748b';
      ctx.font = '9px system-ui';
      ctx.textAlign = 'left';
      ctx.fillText('Suggested pitch zone', lrx - 5, lry + 1);
      ctx.restore();
    }
  }

  if (_sugg.length) {
    animFrameId = requestAnimationFrame(frame);
  } else {
    render(_comps, _sugg);
  }
}

// ═══════════════════════════════════════════════════════════════
// 3D SCENE
// ═══════════════════════════════════════════════════════════════
const THREE = window.THREE;
const sceneCanvas = document.getElementById('scene-canvas');
const sceneRenderer = new THREE.WebGLRenderer({ canvas: sceneCanvas, antialias: true, alpha: true });
sceneRenderer.setPixelRatio(window.devicePixelRatio);
sceneRenderer.setClearColor(0x0d1117, 1);

const sceneCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);
let sceneControls;
try {
  sceneControls = new THREE.OrbitControls(sceneCamera, sceneCanvas);
  sceneControls.enableDamping = true;
} catch(e) {
  sceneControls = { update(){}, target:{ set(){} }, enableDamping: false };
}
const scene3d = new THREE.Scene();
scene3d.add(new THREE.AmbientLight(0xffffff, 0.7));
const dl = new THREE.DirectionalLight(0xffffff, 0.5);
dl.position.set(10, 20, 10);
scene3d.add(dl);

const PLATE_MEASURE_XC = 1.417;
const CAM_PRESETS = {
  side:    { pos:[25,4,27],  tgt:[0,3,27] },
  catcher: { pos:[0,4.5,-8], tgt:[0,3,27] },
  pitcher: { pos:[0,6,65],   tgt:[0,3,27] },
};
let activeCam = 'side';

function setCameraPreset(name) {
  activeCam = name;
  const p = CAM_PRESETS[name];
  sceneCamera.position.set(...p.pos);
  sceneControls.target.set(...p.tgt);
  sceneControls.update();
  document.querySelectorAll('.scam-btn').forEach(b => b.classList.toggle('active', b.dataset.scam === name));
}

// Camera buttons
const camWrap = document.getElementById('scene-cams');
camWrap.innerHTML = ['side','catcher','pitcher'].map(n =>
  \`<button class="scam-btn\${n===activeCam?' active':''}" data-scam="\${n}" style="padding:3px 10px;font-size:10px;font-weight:600;background:#1e293b;color:#64748b;border:1px solid #334155;border-radius:4px;cursor:pointer">\${n.charAt(0).toUpperCase()+n.slice(1)}</button>\`
).join('');
document.querySelectorAll('.scam-btn').forEach(b => b.addEventListener('click', () => setCameraPreset(b.dataset.scam)));
setCameraPreset('side');

// Home plate
(function buildPlate() {
  const shape = new THREE.Shape();
  shape.moveTo(-0.708,0); shape.lineTo(0.708,0); shape.lineTo(0.708,0.5);
  shape.lineTo(0,0.867); shape.lineTo(-0.708,0.5); shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color:0xffffff, side:THREE.DoubleSide });
  const plate = new THREE.Mesh(geo, mat);
  plate.rotation.x = -Math.PI/2;
  scene3d.add(plate);
})();

// Strike zone at z=0 (front of plate, where pitch crosses)
(function buildZone() {
  const geo = new THREE.BoxGeometry(1.42, 2.0, 0.01);
  const edges = new THREE.EdgesGeometry(geo);
  const mat = new THREE.LineBasicMaterial({ color:0x3b82f6, transparent:true, opacity:0.7 });
  const zone = new THREE.LineSegments(edges, mat);
  zone.position.set(0, 2.5, 0);
  scene3d.add(zone);
  const fillMat = new THREE.MeshBasicMaterial({ color:0x3b82f6, transparent:true, opacity:0.06, side:THREE.DoubleSide, depthWrite:false });
  const fill = new THREE.Mesh(new THREE.PlaneGeometry(1.42, 2.0), fillMat);
  fill.position.set(0, 2.5, 0);
  scene3d.add(fill);
})();

// Ground plane
(function buildGround() {
  const geo = new THREE.PlaneGeometry(30, 70);
  const mat = new THREE.MeshLambertMaterial({ color:0x1a2a0a });
  const ground = new THREE.Mesh(geo, mat);
  ground.rotation.x = -Math.PI/2;
  ground.position.set(0, -0.02, 30);
  scene3d.add(ground);
  const grid = new THREE.GridHelper(70, 70, 0x1e2e10, 0x1e2e10);
  grid.position.set(0, -0.01, 30);
  scene3d.add(grid);
})();

// Pitcher's mound + body

}

// ── Synthetic trajectory from pitch metrics ──────────────────
// Build synthetic trajectory coefficients from aggregated pitch metrics.
// Uses kinematic equations: pos(t) = pos0 + vel0*t + 0.5*accel*t^2
// pfx_z/pfx_x in pitcher_profiles are in FEET (Statcast convention).
// releaseOverride: optional { relHeight, relSide } from the Queens pitcher's actual metrics.
// When provided, the trajectory starts from their arm slot instead of the comp's.
function syntheticCoeffs(pitch, p_throws, releaseOverride) {
  const velo   = pitch.velo   || 90;
  const ivb_ft = pitch.ivb    || 0;   // Statcast pfx_z, feet, positive = rise
  const hb_ft  = pitch.hb_sym || 0;   // arm-side positive, feet

  const ft_s     = velo * 1.467;      // mph → ft/s
  const rel_dist = 55;                 // release distance from plate, ft
  const T60      = 60 / ft_s;         // time to travel 60ft (reference for pfx)
  const T        = rel_dist / ft_s;   // approx flight time to plate

  // Magnus accelerations from pfx values (pfx = 0.5*a_magnus*T60^2 → a = 2*pfx/T60^2)
  const az_magnus = 2 * ivb_ft / (T60 * T60);
  const az_total  = -32.174 + az_magnus;

  const isL = p_throws === 'L' || p_throws === 'Left';
  const hb_scene = isL ? -hb_ft : hb_ft;
  const ax_total = 2 * hb_scene / (T60 * T60);

  // Release position: prefer Queens pitcher's real slot, fall back to comp's arm angle
  let rel_y, rel_x;
  if (releaseOverride && releaseOverride.relHeight != null && releaseOverride.relSide != null) {
    rel_y = releaseOverride.relHeight;                       // real release height
    rel_x = -(releaseOverride.relSide);                      // relSide sign → scene x (negated like avgCoeffs)
  } else {
    const arm_deg    = pitch.arm_angle || 45;
    const arm_rad    = arm_deg * Math.PI / 180;
    const arm_radius = 1.5;
    rel_y = pitch.rel_z || 6.0;
    rel_x = Math.cos(arm_rad) * arm_radius * (isL ? -1 : 1);
  }

  // vz0: solve so pitch arrives at ~2.5ft (account for gravity + Magnus vertically)
  const vz0 = (2.5 - rel_y - 0.5 * az_total * T * T) / T;
  // vx0: aim straight at plate center — horizontal Magnus break moves it from there
  // (do NOT compensate for ax_total or every pitch lands at the same spot)
  const vx0 = (0 - rel_x) / T;

  return {
    Xc0: rel_dist, Xc1: -ft_s, Xc2: 0,
    Yc0: rel_y,    Yc1: vz0,   Yc2: 0.5 * az_total,
    Zc0: rel_x,    Zc1: vx0,   Zc2: 0.5 * ax_total,
  };
}

// ── Trajectory point computation ─────────────────────────────
function tAtDist(coeffs, dist) {
  const a=coeffs.Xc2, b=coeffs.Xc1, c=coeffs.Xc0-dist;
  if (Math.abs(a)<1e-9) return Math.abs(b)>1e-9 ? -c/b : null;
  const disc=b*b-4*a*c;
  if (disc<0) return null;
  const t1=(-b+Math.sqrt(disc))/(2*a), t2=(-b-Math.sqrt(disc))/(2*a);
  const valid=[t1,t2].filter(t=>t>0);
  return valid.length ? Math.min(...valid) : null;
}
function posAt(coeffs, t) {
  return {
    dist:   coeffs.Xc0+coeffs.Xc1*t+coeffs.Xc2*t*t,
    height: coeffs.Yc0+coeffs.Yc1*t+coeffs.Yc2*t*t,
    horiz:  coeffs.Zc0+coeffs.Zc1*t+coeffs.Zc2*t*t,
  };
}
function trajectoryPoints(coeffs, n=120) {
  const tP = tAtDist(coeffs, 0);
  if (!tP) return [];
  const pts = [];
  for (let i=0; i<=n; i++) {
    const t = (i/n)*tP;
    const p = posAt(coeffs, t);
    pts.push(new THREE.Vector3(-p.horiz, p.height, p.dist));
  }
  return pts;
}

// ── render3DScene ─────────────────────────────────────────────
function render3DScene() {
  clearTrajectories();
  document.getElementById('scene-empty').style.display =
    (!selectedSuggestion && !Object.keys(pitcherData).length) ? 'flex' : 'none';

  // Draw Queens pitcher's current arsenal (faded) using real Trackman trajectory coefficients
  for (const [type, {pitches}] of Object.entries(pitcherData)) {
    const validPitches = pitches.filter(p => p.PitchTrajectoryXc0 && p.PitchTrajectoryXc0 !== '' && p.PitchTrajectoryXc0 !== 'NA');
    if (!validPitches.length) continue;
    const keys = ['Xc0','Xc1','Xc2','Yc0','Yc1','Yc2','Zc0','Zc1','Zc2'];
    const avgC = {};
    for (const k of keys) {
      const vals = validPitches.map(p => +p[\`PitchTrajectory\${k}\`]).filter(v => !isNaN(v));
      avgC[k] = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    }
    const hex = parseInt((COLORS[type]||'#94a3b8').replace('#',''), 16);
    const pts = trajectoryPoints(avgC);
    if (pts.length) {
      addTrajectoryLine(pts, hex, 0.35);
      addEndpointSphere(pts[pts.length-1], hex, 0.35);
    }
  }

  // Draw selected suggestion (bright) using synthetic coefficients
  if (selectedSuggestion) {
    const { pitch, sc } = selectedSuggestion;
    const hex = parseInt((COLORS[sc]||'#94a3b8').replace('#',''), 16);
    // Always use the Queens pitcher's handedness — hb_sym is already arm-side positive
    // so the trajectory mirrors correctly regardless of the comp's handedness
    const anchorHand = pitcherData[state.selectedType]?.metrics?.hand || 'R';
    const p_throws = (anchorHand === 'L' || anchorHand === 'Left' || anchorHand === 'LHP') ? 'L' : 'R';
    // Use the Queens pitcher's actual release point (anchor pitch metrics)
    const anchorMetrics = state.selectedType ? pitcherData[state.selectedType]?.metrics : null;
    const releaseOverride = anchorMetrics
      ? { relHeight: anchorMetrics.relHeight, relSide: anchorMetrics.relSide }
      : null;
    const coeffs = syntheticCoeffs(pitch, p_throws, releaseOverride);
    const pts = trajectoryPoints(coeffs);
    if (pts.length) {
      addTrajectoryLine(pts, hex, 1.0);
      addEndpointSphere(pts[pts.length-1], hex, 1.0);
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// CSV LOADING
// ═══════════════════════════════════════════════════════════════
function loadFiles(files) {
  const statusEl = document.getElementById('load-status');
  statusEl.textContent = 'Loading…';
  let pending = files.length;
  let newPitches = [];

  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const parsed = parseCSV(e.target.result);
      newPitches = newPitches.concat(parsed);
      pending--;
      if (pending === 0) finishLoad(newPitches);
    };
    reader.readAsText(file);
  });

  function finishLoad(pitches) {
    const seen = new Set(allPitches.map(p =>
      p.PitchUID || \`\${p.Date}_\${p.Time}_\${p.Pitcher}_\${p.PitchNo}\`
    ));
    for (const p of pitches) {
      const uid = p.PitchUID || \`\${p.Date}_\${p.Time}_\${p.Pitcher}_\${p.PitchNo}\`;
      if (!seen.has(uid)) { seen.add(uid); allPitches.push(p); }
    }
    state.pitches = allPitches;
    const total = allPitches.length;
    statusEl.textContent = \`\${total.toLocaleString()} pitches loaded\`;
    // Share with other tabs
    try { window.parent.postMessage({ type:'qub-csv', pitches:allPitches }, '*'); } catch(_){}
    populatePitchers();
    // Reset
    state.pitcherId = null;
    state.selectedType = null;
    pitcherData = {};
    currentComps = null;
    selectedSuggestion = null;
    render3DScene();
    update();
  }
}

function init() {
  // CSV file input
  document.getElementById('csv-input').addEventListener('change', e => {
    if (e.target.files.length) loadFiles(e.target.files);
    e.target.value = '';
  });

  // Queens only checkbox
  document.getElementById('chk-queens').addEventListener('change', e => {
    state.queensOnly = e.target.checked;
    populatePitchers();
    // Reset pitcher if no longer visible
    const sel = document.getElementById('pitcher-sel');
    const stillVisible = Array.from(sel.options).some(o => o.value === state.pitcherId);
    if (!stillVisible) onPitcherChange(null);
  });

  // Pitcher select
  document.getElementById('pitcher-sel').addEventListener('change', e => {
    onPitcherChange(e.target.value || null);
  });

  // Resize
  window.addEventListener('resize', onResize);

  // Drag and drop
  const overlay = document.getElementById('drop-overlay');
  document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag-over'); });
  document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drag-over'); });
  document.addEventListener('drop', e => {
    e.preventDefault();
    document.body.classList.remove('drag-over');
    const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.csv'));
    if (files.length) loadFiles(files);
  });

  // ── Shared CSV: receive from combined.html relay ──────────────────────────
  window.addEventListener('message', e => {
    if (e.data?.type !== 'qub-csv' || !Array.isArray(e.data.pitches)) return;
    allPitches = e.data.pitches;
    state.pitches = allPitches;
    populatePitchers();
    document.getElementById('load-status').textContent = \`\${allPitches.length.toLocaleString()} pitches (shared)\`;
    state.pitcherId = null; state.selectedType = null;
    pitcherData = {}; currentComps = null; selectedSuggestion = null;
    render3DScene();
    update();
  });

  // Clear any stale localStorage from older versions — app always starts empty
  try { localStorage.removeItem('qub-pitches-v1'); } catch(_) {}

  // Initial empty draw
  drawPlot([], []);
  render3DScene();
}

return { init };

(function() {
  var tabs = document.querySelectorAll(".tab-btn");
  var frames = {
    tunneling:   document.getElementById("frame-tunneling"),
    design:      document.getElementById("frame-design"),
    recommender: document.getElementById("frame-recommender")
  };
  var loaders = {
    tunneling:   document.getElementById("loader-tunneling"),
    design:      document.getElementById("loader-design"),
    recommender: document.getElementById("loader-recommender")
  };
  var appHTML = { tunneling: APP_TUNNELING, design: APP_DESIGN, recommender: APP_RECOMMENDER };
  var loaded = {}, ready = {}, lastPitches = null;

  function makeBlobURL(html) {
    return URL.createObjectURL(new Blob([html], { type: "text/html" }));
  }

  function sendToFrame(key, attempts) {
    if (!lastPitches || !ready[key]) return;
    attempts = attempts || 0;
    try {
      var w = frames[key].contentWindow;
      if (w) {
        w.postMessage({ type: 'qub-csv', pitches: lastPitches }, '*');
      }
    } catch(e) {
      if (attempts < 20) setTimeout(function() { sendToFrame(key, attempts + 1); }, 500);
    }
  }

  function broadcastPitches(pitches) {
    lastPitches = pitches;
    Object.keys(frames).forEach(function(k) { if (ready[k]) sendToFrame(k); });
  }

  function loadFrame(key) {
    if (loaded[key]) return;
    loaded[key] = true;
    var f = frames[key], l = loaders[key];
    l.classList.remove("hidden");
    f.addEventListener("load", function() {
      l.classList.add("hidden");
      ready[key] = true;
      if (lastPitches) setTimeout(function() { sendToFrame(key); }, 1500);
    }, { once: true });
    f.src = makeBlobURL(appHTML[key]);
  }

  function switchTab(key) {
    tabs.forEach(function(b) { b.classList.toggle("active", b.dataset.tab === key); });
    Object.keys(frames).forEach(function(k) {
      frames[k].classList.toggle("active", k === key);
      if (k !== key) loaders[k].classList.add("hidden");
    });
    loadFrame(key);
  }
  tabs.forEach(function(btn) { btn.addEventListener("click", function() { switchTab(btn.dataset.tab); }); });

  function normalizePitchType(raw) {
    if (!raw) return "Other";
    var s = raw.trim().toLowerCase().replace(/[\\s_-]+/g, "");
    if(s==="fastball"||s==="fourseamfastball"||s==="fourseam"||s==="4seam"||s==="ff")return"Fastball";
    if(s==="sinker"||s==="twoseamfastball"||s==="twoseam"||s==="2seam"||s==="si")return"Sinker";
    if(s==="changeup"||s==="change"||s==="ch")return"ChangeUp";
    if(s==="curveball"||s==="curve"||s==="cu")return"Curveball";
    if(s==="slider"||s==="sl")return"Slider";
    if(s==="sweeper"||s==="sw")return"Sweeper";
    if(s==="cutter"||s==="cut"||s==="fc")return"Cutter";
    if(s==="splitter"||s==="split"||s==="fs")return"Splitter";
    if(s==="knuckleball"||s==="knuckle"||s==="kn")return"Knuckleball";
    return raw.trim() || "Other";
  }

  var csvLabel = document.getElementById("csv-label");
  var csvText = document.getElementById("csv-text");
  var csvInput = document.getElementById("csv-input");
  var uidCounter = 0;

  function loadCSVFiles(files) {
    var remaining = files.length, all = [];
    if (!remaining) return;
    csvText.textContent = "Parsing...";
    Array.from(files).forEach(function(file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var result = Papa.parse(e.target.result, { header:true, dynamicTyping:false, skipEmptyLines:true });
        if (result.data && result.data.length) {
          result.data.forEach(function(row) {
            if (!row.pitchType) row.pitchType = normalizePitchType(row.TaggedPitchType || row.AutoPitchType || "");
            if (!row.uid) row.uid = "p" + (++uidCounter);
            all.push(row);
          });
        }
        remaining--;
        if (remaining <= 0) { broadcastPitches(all); csvText.textContent = all.length + " pitches loaded"; csvLabel.classList.add("loaded"); }
      };
      reader.readAsText(file);
    });
  }

  csvInput.addEventListener("change", function(e) { if (e.target.files.length) loadCSVFiles(e.target.files); });
  document.addEventListener("dragover", function(e) { e.preventDefault(); });
  document.addEventListener("drop", function(e) { e.preventDefault(); var files = Array.from(e.dataTransfer.files).filter(function(f) { return f.name.endsWith(".csv"); }); if (files.length) loadCSVFiles(files); });

  loadFrame("tunneling");
})();
