<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="QUC Baseball"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0d111c"/>
<title>Queens Baseball Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f1117;color:#e2e8f0}
#tab-bar{display:flex;align-items:stretch;height:44px;background:#0d111c;border-bottom:1px solid #1e2535;padding:0 0 0 12px;gap:2px;flex-shrink:0;user-select:none;-webkit-user-select:none}
.tab-logo{display:flex;align-items:center;gap:8px;padding:0 16px 0 4px;border-right:1px solid #1e2535;margin-right:8px;flex-shrink:0}
.tab-logo-mark{width:22px;height:22px;background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#fff;letter-spacing:-.5px}
.tab-logo-text{font-size:12px;font-weight:700;color:#94a3b8;letter-spacing:.04em;text-transform:uppercase}
.tab-btn{display:flex;align-items:center;gap:7px;padding:0 18px;background:transparent;border:none;border-bottom:2px solid transparent;color:#64748b;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:color .15s,border-color .15s,background .15s;position:relative;top:1px;white-space:nowrap}
.tab-btn:hover{color:#cbd5e1;background:rgba(255,255,255,.03)}
.tab-btn.active{color:#e2e8f0;border-bottom-color:#3b82f6}
.tab-icon{width:14px;height:14px;opacity:.7;flex-shrink:0}
.tab-btn.active .tab-icon{opacity:1}
#content{width:100%;height:calc(100vh - 44px);position:relative}
.tab-frame{position:absolute;inset:0;width:100%;height:100%;border:none;display:none}
.tab-frame.active{display:block}
.tab-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0f1117;color:#475569;font-size:13px}
.tab-loading.hidden{display:none}
.spinner{width:32px;height:32px;border:3px solid #1e2535;border-top-color:#3b82f6;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.csv-label{display:flex;align-items:center;gap:6px;padding:0 14px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#94a3b8;font-size:11px;font-weight:600;letter-spacing:.04em;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap;margin:auto 0 auto 4px;height:28px;flex-shrink:0}
.csv-label:hover{background:#253347;color:#e2e8f0}
.csv-label.loaded{color:#22c55e;border-color:#166534;background:#052e16}
/* iOS safe-area + responsive shell */
body{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);background:#0d111c}
@media(max-width:767px){
  #tab-bar{padding:0 0 0 6px;gap:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #tab-bar::-webkit-scrollbar{display:none}
  .tab-logo{padding:0 8px 0 2px;margin-right:4px}
  .tab-logo-text{display:none}
  .tab-btn{padding:0 10px;font-size:11px;letter-spacing:.02em}
  .tab-btn .tab-label{display:none}
  .tab-icon{width:18px;height:18px;opacity:.85}
  .csv-label{padding:0 10px;font-size:10px}
  .csv-label span{display:none}
  #content{height:calc(100vh - 44px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>

<div id="tab-bar">
  <div class="tab-logo"><div class="tab-logo-mark">Q</div><span class="tab-logo-text">Queens Baseball</span></div>
  <label class="csv-label" id="csv-label">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1v8M4 6l3 3 3-3"/><path d="M1 10v2a1 1 0 001 1h10a1 1 0 001-1v-2"/></svg>
    <span id="csv-text">Load CSV</span>
    <input type="file" accept=".csv" id="csv-input" style="display:none" multiple/>
  </label>
  <button class="tab-btn active" data-tab="tunneling"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 12A10 10 0 1 0 12 22"/><path d="M12 2a15 15 0 0 1 4 10"/><path d="M2 12h10"/></svg><span class="tab-label"> Pitch Tunneling</span></button>
  <button class="tab-btn" data-tab="design"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg><span class="tab-label"> Pitch Design</span></button>
  <button class="tab-btn" data-tab="recommender"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg><span class="tab-label"> Pitch Recommender</span></button>
</div>

<div id="content">
  <div class="tab-loading" id="loader-tunneling"><div class="spinner"></div>Loading Pitch Tunneling...</div>
  <div class="tab-loading hidden" id="loader-design"><div class="spinner"></div>Loading Pitch Design...</div>
  <div class="tab-loading hidden" id="loader-recommender"><div class="spinner"></div>Loading Pitch Recommender...</div>
  <iframe class="tab-frame active" id="frame-tunneling"></iframe>
  <iframe class="tab-frame" id="frame-design"></iframe>
  <iframe class="tab-frame" id="frame-recommender"></iframe>
</div>

<script>
var APP_TUNNELING = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"><\/script>
<title>Pitch Tunneling — QUC Baseball</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:#e2e8f0;background:#0f1117}
#app{display:flex;width:100%;height:100%;overflow:hidden}
/* mobile panel toggle */
#mob-toggle{display:none;position:fixed;top:8px;left:8px;z-index:200;width:40px;height:40px;background:#1a1f2e;border:1px solid #2d3548;border-radius:8px;color:#94a3b8;font-size:18px;cursor:pointer;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
#mob-toggle.open{color:#3b82f6}
#mob-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:149;-webkit-tap-highlight-color:transparent}
#mob-backdrop.open{display:block}
/* mobile quick-camera bar (only <768px) */
#mob-cam-bar{display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:15;background:rgba(15,17,23,.85);backdrop-filter:blur(6px);border:1px solid #2d3548;border-radius:8px;padding:3px;gap:2px}
#mob-cam-bar .mcb{padding:6px 9px;background:transparent;border:none;color:#94a3b8;font-size:11px;font-weight:600;border-radius:5px;cursor:pointer;-webkit-tap-highlight-color:transparent;min-width:42px}
#mob-cam-bar .mcb.active{background:#1d4ed8;color:#fff}
@media(max-width:767px){
  body{padding-bottom:env(safe-area-inset-bottom,0)}
  #mob-toggle{display:flex}
  #left-panel{position:fixed!important;top:0;left:0;bottom:0;z-index:150;transform:translateX(-100%);transition:transform .25s ease;width:min(320px,86vw)!important;min-width:0!important;padding-bottom:env(safe-area-inset-bottom,0)}
  #left-panel.open{transform:translateX(0)}
  #main{padding-top:48px}
  #right-overlay{top:60px!important;right:8px!important;font-size:10px}
  #mob-cam-bar{display:flex}
  /* compact info panel: scrollable, fits all content + home indicator */
  #info-panel{height:auto!important;min-height:0!important;padding:6px 8px!important;overflow-x:auto!important;overflow-y:hidden!important;-webkit-overflow-scrolling:touch;gap:0;scrollbar-width:none;align-items:stretch!important}
  #info-panel::-webkit-scrollbar{display:none}
  #info-panel .metric{flex:0 0 auto;min-width:82px;padding:0 8px;gap:2px;justify-content:center}
  #info-panel .metric-lbl{font-size:8px;letter-spacing:.04em;line-height:1.1}
  #info-panel .metric-val{font-size:13px;line-height:1.1}
  #info-panel .metric-tag{font-size:8px;padding:1px 4px;margin-top:2px}
  #info-panel .mdiv{height:auto;align-self:stretch}
  #mvmt-card{font-size:10px!important;padding:6px 8px!important;min-width:120px!important}
}
/* ── Left Panel ── */
#left-panel{width:320px;min-width:320px;height:100%;background:#1a1f2e;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;border-right:1px solid #2d3548;scrollbar-width:thin;scrollbar-color:#3b82f6 #1a1f2e}
#left-panel::-webkit-scrollbar{width:4px}
#left-panel::-webkit-scrollbar-thumb{background:#3b82f6;border-radius:2px}
.panel-header{padding:14px 14px 10px;border-bottom:1px solid #2d3548;background:#131722;flex-shrink:0}
.app-title{display:block;font-size:16px;font-weight:700;color:#f1f5f9;letter-spacing:.02em}
.app-sub{display:block;font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.section{padding:11px 13px;border-bottom:1px solid #242938;flex-shrink:0}
.sec-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#64748b;margin-bottom:7px}
/* dropzone */
.dropzone{border:1.5px dashed #2d3548;border-radius:7px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:#64748b;font-size:11px;text-align:center;transition:border-color .2s,color .2s,background .2s;user-select:none;-webkit-user-select:none}
.dropzone:hover,.dropzone.drag-over{border-color:#3b82f6;color:#93c5fd;background:rgba(59,130,246,.06)}
.dropzone svg{opacity:.6}
.loaded-files{margin-top:7px;display:flex;flex-direction:column;gap:3px}
.file-row{display:flex;justify-content:space-between;align-items:center;background:#242938;border-radius:5px;padding:4px 8px}
.file-name{font-size:11px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.file-count{font-size:10px;color:#3b82f6;font-weight:600;margin-left:4px}
/* select */
select{background:#242938;border:1px solid #2d3548;border-radius:5px;color:#e2e8f0;padding:5px 8px;font-size:12px;appearance:none;-webkit-appearance:none;cursor:pointer;outline:none;width:100%}
select:focus{border-color:#3b82f6}
/* pitch selector */
.pitch-sel{display:flex;flex-direction:column;gap:5px}
.pitch-sel-header{border-left:3px solid #3b82f6;padding-left:7px;margin-bottom:3px}
.pitch-sel-label{font-size:12px;font-weight:600;color:#cbd5e1}
.ctrl-row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.ctrl-lbl{font-size:11px;color:#64748b;min-width:60px;flex-shrink:0}
.toggle-grp{display:flex;gap:2px;background:#242938;border-radius:5px;padding:2px}
.tog{border:none;background:transparent;color:#64748b;font-size:11px;padding:3px 10px;border-radius:4px;cursor:pointer;transition:background .15s,color .15s}
.tog.active{background:#3b82f6;color:#fff}
/* zone grid */
.zone-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#131722;border:1px solid #2d3548;border-radius:6px;padding:4px;margin-top:4px}
.zone-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;border:1.5px solid transparent;transition:border-color .15s,transform .1s;min-height:36px;user-select:none;-webkit-user-select:none}
.zone-cell:hover{border-color:#3b82f6;transform:scale(1.04)}
.zone-cell.sel{border-color:#f1f5f9!important;box-shadow:0 0 0 2px rgba(59,130,246,.5)}
.z-num{font-size:13px;font-weight:700;color:rgba(255,255,255,.85)}
.z-sc{font-size:9px;color:rgba(255,255,255,.6);margin-top:1px}
/* pitch info card */
.pitch-card{background:#131722;border:1px solid #2d3548;border-radius:6px;padding:7px 9px;display:flex;flex-direction:column;gap:3px;margin-top:3px}
.pitch-card.empty{justify-content:center;align-items:center;min-height:42px}
.pitch-empty{color:#374151;font-size:11px;font-style:italic}
.card-row{display:flex;justify-content:space-between;align-items:center}
.card-key{font-size:10px;color:#64748b}
.card-val{font-size:11px;color:#cbd5e1;font-weight:500}
.card-score{color:#3b82f6;font-weight:700}
/* zone orientation label */
.zone-orient{display:flex;justify-content:space-between;padding:0 2px;margin-bottom:1px;font-size:9px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:.06em}
/* checkbox */
.chk-row{display:flex;align-items:center;gap:7px;font-size:12px;color:#94a3b8;cursor:pointer;padding:2px 0}
.chk-row input{accent-color:#3b82f6;width:14px;height:14px}
/* camera buttons */
.cam-btns{display:flex;flex-wrap:wrap;gap:4px}
.cam-btn{flex:1 1 auto;min-width:52px;padding:5px 6px;background:#242938;border:1px solid #2d3548;border-radius:5px;color:#94a3b8;font-size:11px;cursor:pointer;transition:background .15s,color .15s;font-weight:500}
.cam-btn:hover{border-color:#3b82f6;color:#93c5fd}
.cam-btn.active{background:#1d4ed8;border-color:#3b82f6;color:#fff}
/* ── Main Content ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#canvas-wrap{flex:1;position:relative;overflow:hidden}
#right-overlay{position:absolute;top:10px;right:12px;display:flex;flex-direction:column;gap:7px;pointer-events:none;z-index:10}
#mvmt-card{background:rgba(15,17,23,.88);backdrop-filter:blur(4px);border:1px solid #2d3548;border-radius:7px;padding:8px 11px;font-size:11px;color:#cbd5e1;min-width:140px;display:none}
#mvmt-card .mc-title{font-size:11px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:6px}
#mvmt-card .mc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
#mvmt-card .mc-row{display:flex;justify-content:space-between;gap:12px;padding:1px 0}
#mvmt-card .mc-lbl{color:#64748b;font-size:10px}
#mvmt-card .mc-val{font-weight:600;color:#e2e8f0;font-size:11px}
canvas#scene{width:100%!important;height:100%!important;display:block;background:#0a0d14}
/* legend */
#legend{display:flex;flex-direction:column;gap:4px}
.leg-item{display:flex;align-items:center;gap:5px;background:rgba(15,17,23,.8);backdrop-filter:blur(4px);border-radius:5px;padding:4px 8px;font-size:11px}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
/* ── Info Panel ── */
#info-panel{height:64px;min-height:64px;background:#131722;border-top:1px solid #2d3548;display:flex;align-items:center;padding:0 14px;flex-shrink:0;overflow:hidden}
.metric{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;padding:0 10px}
.metric:first-child{padding-left:0}
.metric-lbl{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#64748b;white-space:nowrap}
.metric-val{font-size:18px;font-weight:700;color:#e2e8f0;white-space:nowrap}
.metric-tag{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:3px;margin-top:1px;width:fit-content}
.metric-tag.elite{background:rgba(34,197,94,.18);color:#4ade80}
.metric-tag.good{background:rgba(59,130,246,.18);color:#60a5fa}
.metric-tag.avg{background:rgba(234,179,8,.15);color:#fbbf24}
.metric-tag.poor{background:rgba(239,68,68,.15);color:#f87171}
.metric-val.blue{color:#3b82f6}
.mdiv{width:1px;height:38px;background:#2d3548;flex-shrink:0}
/* arsenal rows */
.arsenal-row{border-radius:6px;padding:6px 8px;margin-bottom:4px;background:#131722;border:1.5px solid transparent;cursor:pointer;transition:border-color .15s}
.arsenal-row:hover{border-color:#3b82f640}
.arsenal-row.selected{border-color:#3b82f6}
.arsenal-row.is-anchor{border-color:#FFD70066}
.arsenal-row.card-sel .arsenal-row-hdr{background:rgba(59,130,246,.1);border-radius:4px;margin:-2px;padding:2px}
.arsenal-row.is-active{box-shadow:0 0 0 2px #3b82f6aa}
.arsenal-row-hdr{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.arsenal-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.arsenal-name{font-size:12px;font-weight:600;flex:1;color:#cbd5e1}
.anchor-tag{font-size:9px;font-weight:700;color:#FFD700;border:1px solid #FFD70066;border-radius:3px;padding:0 4px;cursor:pointer;white-space:nowrap}
.reset-tag{font-size:10px;color:#64748b;cursor:pointer;transition:color .15s;line-height:1}
.reset-tag:hover{color:#93c5fd}
.arsenal-loc{font-size:10px;color:#64748b;display:flex;justify-content:space-between;align-items:center}
.arsenal-tdist{font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px}
/* arsenal sliders */
.arsenal-sliders{padding:2px 0 1px 0}
.arsl-slider-row{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.arsl-lbl{font-size:9px;color:#94a3b8;font-weight:700;width:10px;flex-shrink:0;text-align:center}
.arsl-slider-row input[type=range]{flex:1;height:3px;cursor:pointer;margin:0}
.arsl-val{font-size:9px;color:#cbd5e1;width:30px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.arsl-slider-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1px}
.arsl-anchor-loc{font-size:10px;color:#64748b;display:flex;justify-content:space-between;align-items:center;margin-top:1px}
/* hidden zone-grid wrapper */
.zone-wrap{display:none}
.zone-wrap.show{display:block}
/* color for accentcolor on pitch sel header */
[data-accent="ref"] .pitch-sel-header{border-left-color:#ef4444}
[data-accent="tunnel"] .pitch-sel-header{border-left-color:#4488ff}
</style>
</head>
<body>
<button id="mob-toggle" aria-label="Toggle panel">☰</button>
<div id="mob-backdrop"></div>
<div id="app">
  <!-- Left Panel -->
  <div id="left-panel">
    <div class="panel-header">
      <span class="app-title">Pitch Tunneling</span>
      <span class="app-sub">3D Analysis — QUC Baseball</span>
    </div>

    <!-- Data -->
    <div class="section">
      <div class="sec-title">Data</div>
      <div class="dropzone" id="dropzone">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>Drop Trackman CSV or click to browse</span>
        <input type="file" accept=".csv" multiple id="file-input" style="display:none"/>
      </div>
      <div class="loaded-files" id="loaded-files"></div>
    </div>

    <!-- Pitcher -->
    <div class="section">
      <div class="sec-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>Pitcher</span>
        <label class="chk-row" style="margin:0;font-size:10px;color:#64748b">
          <input type="checkbox" id="chk-queens" style="width:11px;height:11px"/> Queens Only
        </label>
      </div>
      <select id="pitcher-sel"><option value="">— Load CSV first —</option></select>
    </div>

    <!-- Reference Pitch -->
    <div class="section" id="ref-section" data-accent="ref">
      <div class="sec-title">Reference Pitch</div>
      <div class="pitch-sel" id="ref-sel">
        <div class="pitch-sel-header"><span class="pitch-sel-label">Reference</span></div>
        <div class="ctrl-row">
          <span class="ctrl-lbl">Pitch Type</span>
          <select id="ref-type" style="flex:1"><option value="">— Select —</option></select>
        </div>
        <div class="ctrl-row">
          <span class="ctrl-lbl">Selection</span>
          <div class="toggle-grp">
            <button class="tog active" data-for="ref" data-mode="auto">Auto</button>
            <button class="tog" data-for="ref" data-mode="manual">Zone</button>
          </div>
        </div>
        <div class="zone-wrap" id="ref-zone-wrap">
          <div class="zone-grid" id="ref-zone-grid"></div>
        </div>
        <div class="pitch-card empty" id="ref-card"><span class="pitch-empty">No pitch selected</span></div>
      </div>
    </div>

    <!-- Tunnel Pitch -->
    <div class="section" id="tunnel-section" data-accent="tunnel">
      <div class="sec-title">Tunnel Pitch</div>
      <div class="pitch-sel" id="tunnel-sel">
        <div class="pitch-sel-header"><span class="pitch-sel-label">Tunnel</span></div>

<script>
const OrbitControls = THREE.OrbitControls;

// ═══════════════════════════════════════════════════════════════════════════════
// PITCH COLORS
// ═══════════════════════════════════════════════════════════════════════════════
const PITCH_COLORS = {
  Fastball: '#ef4444', FourSeamFastBall: '#ef4444', 'Four-Seam': '#ef4444',
  Sinker: '#f97316', TwoSeamFastBall: '#f97316',
  Cutter: '#eab308',
  ChangeUp: '#10b981', Changeup: '#10b981',
  Splitter: '#06b6d4',
  Curveball: '#3b82f6',
  Slider: '#8b5cf6',
  Sweeper: '#ec4899',
  Knuckleball: '#6b7280',
};
function pitchColor(type) {
  if (!type) return '#AAAAAA';
  for (const [k, v] of Object.entries(PITCH_COLORS)) {
    if (type.toLowerCase().includes(k.toLowerCase())) return v;
  }
  return '#AAAAAA';
}

// ═══════════════════════════════════════════════════════════════════════════════
// CSV PARSER
// ═══════════════════════════════════════════════════════════════════════════════
async function loadPapaparse() { return Promise.resolve(window.Papa); }

function normalizePitchType(t) {
  if (!t || t === 'Unknown') return 'Unknown';
  const l = t.toLowerCase().replace(/[\\s_-]/g,'');
  if (l.includes('fourseam') || l === 'fastball' || l === 'four-seam' || l === '4seam') return 'Fastball';
  if (l.includes('twoseam') || l === 'sinker') return 'Sinker';
  if (l.includes('changeup') || l.includes('change')) return 'ChangeUp';
  if (l.includes('curveball') || l.includes('curve')) return 'Curveball';
  if (l.includes('slider')) return 'Slider';
  if (l.includes('sweeper')) return 'Sweeper';
  if (l.includes('cutter')) return 'Cutter';
  if (l.includes('splitter') || l.includes('split')) return 'Splitter';
  if (l.includes('knuckle')) return 'Knuckleball';
  return t; // preserve unknown types as-is
}
async function parsePitchCSV(text) {
  if (!Papa) Papa = await loadPapaparse();
  const result = Papa.parse(text, { header: true, dynamicTyping: false, skipEmptyLines: true });
  return result.data.filter(row => {
    const n = String(row.Pitcher||'').toLowerCase();
    // Keontay Booker is a position player mistagged as a pitcher — filter out
    if (n.includes('keontay')) return false;
    return true;
  }).map(row => {
    const tagged = row.TaggedPitchType;
    const auto = row.AutoPitchType;
    const rawType =
      tagged && tagged !== 'Undefined' && tagged !== '' ? tagged :
      auto && auto !== 'Undefined' && auto !== '' ? auto : 'Unknown';
    const pitchType = normalizePitchType(rawType);
    const uid = row.PitchUID || \`\${row.Date}_\${row.Time}_\${row.Pitcher}_\${row.PitchNo}\`;

}
function mergePitches(existing, incoming) {
  const uids = new Set(existing.map(p => p.uid));
  return [...existing, ...incoming.filter(p => !uids.has(p.uid))];
}
function isQueensPitcher(p) {
  const t = (p.PitcherTeam || '').toLowerCase();
  return t.includes('qun') || t.includes('quc') || t.includes('queens') || t.includes('ryl') || t === '';
}
function getPitchers(pitches, queensOnly=false) {
  const seen = new Map();
  for (const p of pitches) {
    if (queensOnly && !isQueensPitcher(p)) continue;
    if (p.PitcherId && p.PitcherId !== '' && !seen.has(p.PitcherId)) {
      seen.set(p.PitcherId, { id: p.PitcherId, name: p.Pitcher || p.PitcherId, throws: p.PitcherThrows || '' });
    }

  return Array.from(seen.values()).sort((a, b) => a.name.localeCompare(b.name));
}
// Verified pitch arsenals from QUC scouting card
// Gowan + Curveball and Jones + Slider added per coaching staff
const QUEENS_ARSENAL = {
  'ruller':     ['Fastball','Sinker','Slider','Cutter','ChangeUp'],
  'eagen':      ['Fastball','Sinker','Slider','Curveball','ChangeUp'],
  'gowan':      ['Fastball','Sinker','Slider','ChangeUp','Curveball'],
  'quezada':    ['Fastball','Sinker','Slider','Cutter','Curveball','ChangeUp'],
  'young':      ['Fastball','Slider','Cutter','ChangeUp'],
  'shipman':    ['Fastball','Sinker','Slider','Curveball','ChangeUp'],
  'pollard':    ['Fastball','Curveball','Cutter'],
  'joseph':     ['Sinker','Fastball','Slider','ChangeUp'],
  'booker':     ['Fastball','Curveball','ChangeUp'],
  'clevidence': ['Fastball','Curveball','ChangeUp'],
  'martino':    ['Fastball','Curveball','Cutter','Knuckleball'],
  'hudson':     ['Fastball','Slider','ChangeUp'],
  'green':      ['Fastball','Sinker','Slider','ChangeUp'],
  'jones':      ['Fastball','Sinker','Curveball','ChangeUp','Slider'],
  'neave':      ['Sinker','Slider','ChangeUp'],
  'brodeur':    ['Fastball','Slider','ChangeUp'],
  'savona':     ['Fastball','Curveball'],
};
function getQueensWhitelist(pitches, pitcherId) {
  const pitch = pitches.find(p => p.PitcherId === pitcherId);
  if (!pitch) return null;
  const name = (pitch.Pitcher || '').toLowerCase();
  for (const key of Object.keys(QUEENS_ARSENAL)) {
    if (name.includes(key)) return new Set(QUEENS_ARSENAL[key]);
  }
  return null;
}
function getPitchTypes(pitches, pitcherId) {
  const whitelist = getQueensWhitelist(pitches, pitcherId);
  // Count occurrences per type
  const counts = {};
  let total = 0;
  for (const p of pitches) {
    if (p.PitcherId !== pitcherId) continue;
    const t = p.pitchType;
    if (!t || t === 'Unknown') continue;
    counts[t] = (counts[t] || 0) + 1;
    total++;
  }
  if (whitelist) {
    // Queens pitcher: only show types on the scouting card that also appear in data
    return Object.entries(counts)
      .filter(([t]) => whitelist.has(t))
      .sort((a, b) => b[1] - a[1])
      .map(([t]) => t);
  }
  // Non-Queens pitcher: require ≥5 pitches and ≥3% of total
  const MIN_COUNT = 5, MIN_PCT = 0.03;
  return Object.entries(counts)
    .filter(([, c]) => c >= MIN_COUNT && c / total >= MIN_PCT)
    .sort((a, b) => b[1] - a[1])
    .map(([t]) => t);
}
function filterPitches(pitches, pitcherId, pitchType) {
  return pitches.filter(p => p.PitcherId === pitcherId && p.pitchType === pitchType);
}
function getZoneNumber(h, s) {
  // 3x3 from catcher's view: col 0=left(positive PlateLocSide=3B side), col 2=right(negative=1B side)
  // row 0=top, row 2=bottom
  let col = s > 0.28 ? 0 : s > -0.28 ? 1 : 2;
  let row = h > 2.83 ? 0 : h > 2.17 ? 1 : 2;
  return row * 3 + col + 1;
}

// ═══════════════════════════════════════════════════════════════════════════════
// PITCH SCORING
// ═══════════════════════════════════════════════════════════════════════════════
function scorePitch(p) {
  const call = p.PitchCall;
  if (call === 'StrikeSwinging') return 5;
  if (call === 'StrikeCalled') return 4;
  if (call === 'FoulBallNotFieldable') return 3;
  if (call === 'FoulBallFieldable') return 2.5;
  if (call === 'HitByPitch') return 0;
  if (call === 'BallCalled') return 0.5;
  if (call === 'BallinDirt') return 1;
  if (call === 'InPlay') {
    const es = p.ExitSpeed;
    if (!es || es === '' || es === 'NA') return 1.5;
    const speed = parseFloat(es);
    const ang = parseFloat(p.Angle);
    if (isNaN(speed) || isNaN(ang)) return 1.5;
    if (speed >= 90 && ang >= 10 && ang <= 35) return 0;
    if (speed < 80 || ang < 10 || ang > 35) return 3;
    return 1.5;
  }
  return 0.5;
}
function getBestPitchForZone(pitches, zone) {
  const inZone = pitches.filter(p => {
    const h = parseFloat(p.PlateLocHeight), s = parseFloat(p.PlateLocSide);
    return !isNaN(h) && !isNaN(s) && getZoneNumber(h, s) === zone;
  });
  if (!inZone.length) return null;
  return inZone.reduce((best, p) => scorePitch(p) > scorePitch(best) ? p : best, inZone[0]);
}
function getBestPitchAuto(pitches) {
  if (!pitches.length) return null;
  const zoneSums = {}, zoneCounts = {}, zonePitches = {};
  for (const p of pitches) {
    const h = parseFloat(p.PlateLocHeight), s = parseFloat(p.PlateLocSide);
    if (isNaN(h) || isNaN(s)) continue;
    const z = getZoneNumber(h, s);
    zoneSums[z] = (zoneSums[z] || 0) + scorePitch(p);
    zoneCounts[z] = (zoneCounts[z] || 0) + 1;
    (zonePitches[z] = zonePitches[z] || []).push(p);
  }
  let bestZone = null, bestAvg = -Infinity;
  for (const z of Object.keys(zoneSums)) {
    const avg = zoneSums[z] / zoneCounts[z];
    if (avg > bestAvg) { bestAvg = avg; bestZone = z; }
  }
  if (!bestZone) return null;
  const cands = zonePitches[bestZone];
  const ch = cands.reduce((s,p)=>s+parseFloat(p.PlateLocHeight||0),0)/cands.length;
  const cs = cands.reduce((s,p)=>s+parseFloat(p.PlateLocSide||0),0)/cands.length;
  let best = null, bestScore = -Infinity, bestDist = Infinity;
  for (const p of cands) {
    const score = scorePitch(p);
    const d = Math.hypot(parseFloat(p.PlateLocHeight||0)-ch, parseFloat(p.PlateLocSide||0)-cs);
    if (score > bestScore || (score === bestScore && d < bestDist)) {
      bestScore = score; bestDist = d; best = p;
    }
  }
  return best;
}
function zoneAvgScores(pitches) {
  const sums = {}, counts = {};
  for (const p of pitches) {
    const h = parseFloat(p.PlateLocHeight), s = parseFloat(p.PlateLocSide);
    if (isNaN(h) || isNaN(s)) continue;
    const z = getZoneNumber(h, s);
    sums[z] = (sums[z] || 0) + scorePitch(p);
    counts[z] = (counts[z] || 0) + 1;
  }
  const out = {};
  for (const z of Object.keys(sums)) out[z] = sums[z] / counts[z];
  return out;
}
function computeEffHeatmap(pitches) {
  const step = 0.1, sideMin = -1.5, sideMax = 1.5, hMin = 0.5, hMax = 5.0;
  const cols = Math.round((sideMax - sideMin) / step) + 1;
  const rows = Math.round((hMax - hMin) / step) + 1;
  const sums = Array.from({length:rows},()=>new Array(cols).fill(0));
  const counts = Array.from({length:rows},()=>new Array(cols).fill(0));
  for (const p of pitches) {
    const h = parseFloat(p.PlateLocHeight), s = parseFloat(p.PlateLocSide);
    if (isNaN(h)||isNaN(s)||h<hMin||h>hMax||s<sideMin||s>sideMax) continue;
    const r = Math.round((h-hMin)/step), c = Math.round((s-sideMin)/step);
    if (r>=0&&r<rows&&c>=0&&c<cols){sums[r][c]+=scorePitch(p);counts[r][c]++;}
  }
  const grid = sums.map((row,r)=>row.map((_,c)=>counts[r][c]>0?sums[r][c]/counts[r][c]:null));
  return { grid, rows, cols, sideMin, sideMax, hMin, hMax, step };
}

// ═══════════════════════════════════════════════════════════════════════════════
// TRAJECTORY PHYSICS
// ═══════════════════════════════════════════════════════════════════════════════
// scene.x = Zc polynomial (horizontal, positive = scene right)
// scene.y = Yc polynomial (height)
// scene.z = Xc polynomial (dist from plate, ~54 at release → 0 at plate)
function getCoeffs(pitch) {
  const xc0 = pitch.PitchTrajectoryXc0;
  if (xc0 && xc0 !== '' && xc0 !== 'NA') {
    return {
      Xc0: +pitch.PitchTrajectoryXc0, Xc1: +pitch.PitchTrajectoryXc1, Xc2: +pitch.PitchTrajectoryXc2,
      Yc0: +pitch.PitchTrajectoryYc0, Yc1: +pitch.PitchTrajectoryYc1, Yc2: +pitch.PitchTrajectoryYc2,
      Zc0: +pitch.PitchTrajectoryZc0, Zc1: +pitch.PitchTrajectoryZc1, Zc2: +pitch.PitchTrajectoryZc2,
    };
  }
  const x0 = pitch.x0;
  if (x0 && x0 !== '' && x0 !== 'NA') {
    return {
      Xc0: +pitch.y0, Xc1: +pitch.vy0, Xc2: 0.5*(+pitch.ay0),
      Yc0: +pitch.z0, Yc1: +pitch.vz0, Yc2: 0.5*(+pitch.az0),
      Zc0: +pitch.x0, Zc1: +pitch.vx0, Zc2: 0.5*(+pitch.ax0),
    };
  }
  return null;
}
function avgCoeffs(pitches) {
  const valid = pitches.map(getCoeffs).filter(Boolean);
  if (!valid.length) return null;
  const keys = ['Xc0','Xc1','Xc2','Yc0','Yc1','Yc2','Zc0','Zc1','Zc2'];
  const out = {};
  for (const k of keys) out[k] = valid.reduce((s,c)=>s+c[k],0)/valid.length;
  return out;
}
function solveSmallPosQuadratic(a, b, c) {
  if (Math.abs(a) < 1e-10) { const t=-c/b; return t>1e-6?t:null; }
  const d = b*b - 4*a*c;
  if (d < 0) return null;
  const sq = Math.sqrt(d);
  const t1 = (-b-sq)/(2*a), t2 = (-b+sq)/(2*a);
  const pos = [t1,t2].filter(t=>t>1e-6);
  return pos.length ? Math.min(...pos) : null;
}
function tAtDist(coeffs, dist) {
  return solveSmallPosQuadratic(coeffs.Xc2, coeffs.Xc1, coeffs.Xc0 - dist);
}
function posAt(coeffs, t) {
  return {
    dist: coeffs.Xc0+coeffs.Xc1*t+coeffs.Xc2*t*t,
    height: coeffs.Yc0+coeffs.Yc1*t+coeffs.Yc2*t*t,
    horiz: coeffs.Zc0+coeffs.Zc1*t+coeffs.Zc2*t*t,

// Trackman measures PlateLocHeight/Side at the BACK POINT of home plate,
// which is 17 inches (1.4167 ft) behind the front edge. The polynomial
// X=0 corresponds to the front edge of the plate. Validated against CSV:
// mean height error drops from 2.25" (at Xc=0) to 0.05" (at Xc=1.417).
const PLATE_MEASURE_XC = 1.417; // feet — where PlateLocHeight/Side are measured

function posAtPlate(coeffs) {
  // Evaluate at Xc=1.417 to match Trackman's measurement point
  const t = tAtDist(coeffs, PLATE_MEASURE_XC);
  return t ? posAt(coeffs, t) : null;
}
function posAtFrontOfPlate(coeffs) {
  // Front visible edge of plate (Xc=0), used for trajectory endpoint
  const t = tAtDist(coeffs, 0);
  return t ? posAt(coeffs, t) : null;
}
function posAt23(coeffs) { const t=tAtDist(coeffs,23); return t?posAt(coeffs,t):null; }
function trajectoryPoints(coeffs, n=150) {
  // Draw from release to front edge of plate (Xc=0)
  const tP = tAtDist(coeffs, 0);
  if (!tP) return [];
  const pts = [];
  for (let i=0;i<=n;i++) {
    const t = (i/n)*tP;
    const p = posAt(coeffs, t);
    pts.push(new THREE.Vector3(-p.horiz, p.height, p.dist));
  }
  return pts;
}
function tunnelDist(cA, cB) {
  const a = posAt23(cA), b = posAt23(cB);
  if (!a||!b) return null;
  return Math.hypot(a.height-b.height, a.horiz-b.horiz)*12; // inches
}
function divergencePoint(cA, cB, thresh=2/12) {
  // Walk from release toward plate in 0.1ft steps for precision (~1.2in resolution)
  const maxD = Math.min(cA.Xc0, cB.Xc0);
  for (let d=maxD; d>=0; d-=0.1) {
    const tA=tAtDist(cA,d), tB=tAtDist(cB,d);
    if (!tA||!tB) continue;
    const pA=posAt(cA,tA), pB=posAt(cB,tB);
    if (Math.hypot(pA.height-pB.height, pA.horiz-pB.horiz) > thresh)
      return { dist: Math.round(d*10)/10 };
  }
  return null;
}

// ═══════════════════════════════════════════════════════════════════════════════
// TUNNEL OPTIMIZER
// ═══════════════════════════════════════════════════════════════════════════════
// targetH = PlateLocHeight (ft), targetS_poly = Zc polynomial value at plate = -PlateLocSide
function coeffsForTarget(avg, targetH, targetS_poly) {
  // Solve at PLATE_MEASURE_XC (where Trackman actually measures PlateLocHeight/Side)
  const tP = tAtDist(avg, PLATE_MEASURE_XC);
  if (!tP) return null;
  const Yc1 = (targetH - avg.Yc0 - avg.Yc2*tP*tP) / tP;
  const Zc1 = (targetS_poly - avg.Zc0 - avg.Zc2*tP*tP) / tP;
  return { ...avg, Yc1, Zc1 };
}
function computeTunnelHeatmap(refCoeffs, avgTCoeffs) {
  const ref23 = posAt23(refCoeffs);
  if (!ref23) return null;
  const hStep=0.1, sStep=0.1, hMin=0.5, hMax=5.0, sMin=-2.0, sMax=2.0;
  const rows = Math.round((hMax-hMin)/hStep)+1;
  const cols = Math.round((sMax-sMin)/sStep)+1;
  const grid = [];
  let minD=Infinity, maxD=0, minCell=null;
  for (let r=0;r<rows;r++) {
    const row=[];
    const h = hMin+r*hStep;
    for (let c=0;c<cols;c++) {
      // sMin/sMax is in PlateLocSide space; convert to Zc_poly space: Zc_poly = -PlateLocSide
      const plateSide = sMin+c*sStep;
      const sPoly = -plateSide; // convert to polynomial Z space
      const nc = coeffsForTarget(avgTCoeffs, h, sPoly);
      if (!nc){row.push(null);continue;}
      const p23 = posAt23(nc);
      if (!p23){row.push(null);continue;}
      const d = Math.hypot(p23.height-ref23.height,p23.horiz-ref23.horiz)*12;
      row.push(d);
      if (d<minD){minD=d;minCell={r,c,h,plateSide,d};}
      if (d>maxD) maxD=d;
    }
    grid.push(row);
  }
  return {grid,rows,cols,minD,maxD,minCell,hMin,hMax,sMin,sMax,hStep,sStep};
}

// ── Aim Point (spinless-ball, gravity-only) ────────────────────────────────
// AIM POINT — fastball-relative
// The aim = where to look/throw so the pitch's movement relative to the
// fastball carries it to the placed endpoint.
//
//   aim = endpoint + (Yc2_fb − Yc2_pitch) × tP²   (vertical)
//   aim = endpoint + (Zc2_fb − Zc2_pitch) × tP²   (horizontal)
//
// • Fastball: Yc2_fb = Yc2_fb → offset = 0 → aim = endpoint. You aim
//   where you want it. Correct.
// • Curveball (Yc2 more negative than FB): offset > 0 → aim ABOVE endpoint.
//   "Aim at the hip to land at the knee." ✓
// • Sinker (slightly less IVB than FB): aim slightly above + glove-side.
// • Slider (less arm-side HB than FB): aim arm-side of endpoint.
//
// fbCoeffs = the pitcher's fastball locCoeffs (or avgCoeffs).
// If null, falls back to self → aim = endpoint (no useful cue, but no garbage).
function aimPointAtPlate(coeffs, fbCoeffs) {
  if (!coeffs) return null;
  const tP = tAtDist(coeffs, 0);
  if (!tP) return null;
  const fb = fbCoeffs || coeffs; // fallback: aim = endpoint
  return {
    height: coeffs.Yc0 + coeffs.Yc1*tP + fb.Yc2*tP*tP,
    horiz:  coeffs.Zc0 + coeffs.Zc1*tP + fb.Zc2*tP*tP,
    dist: 0,
  };
}

// Find the pitcher's fastball coefficients from the arsenal map.
// Used as the aim baseline so FB aim = endpoint, all others offset from it.
function getFbCoeffs(arsenalTypes) {
  if (!arsenalTypes) return null;
  // Name-based search — covers Trackman naming conventions
  const order = [
    t => /^four.?seam/i.test(t),
    t => /^fastball/i.test(t),
    t => /^4.?seam/i.test(t),
    t => /^(FB|FS|FA)$/i.test(t),
    t => /sinker|two.?seam/i.test(t),
  ];
  for (const test of order) {
    const key = Object.keys(arsenalTypes).find(test);
    if (key) {
      const c = arsenalTypes[key].locCoeffs || arsenalTypes[key].avgCoeffs;
      if (c) return c;
    }
  }
  // Last resort: pitch with highest Yc2 (least drop = closest to FB)
  let bestKey = null, bestYc2 = -Infinity;
  for (const [k, e] of Object.entries(arsenalTypes)) {
    const c = e.locCoeffs || e.avgCoeffs;
    if (c && c.Yc2 > bestYc2) { bestYc2 = c.Yc2; bestKey = k; }
  }
  return bestKey ? (arsenalTypes[bestKey].locCoeffs || arsenalTypes[bestKey].avgCoeffs) : null;
}

function makeHeatmapMesh(data, type) {
  if (!data) return null;
  let grid, rows, cols, xMin, xMax, yMin, yMax, minV, maxV;

  if (type === 'tunnel') {
    // sMin/sMax are in PlateLocSide space (-2 to +2)
    ({grid,rows,cols,sMin:xMin,sMax:xMax,hMin:yMin,hMax:yMax,minD:minV,maxD:maxV} = data);
  } else {
    // effectiveness: sideMin/sideMax are PlateLocSide space (-1.5 to +1.5)
    ({grid,rows,cols,sideMin:xMin,sideMax:xMax,hMin:yMin,hMax:yMax} = data);
    let mn=Infinity, mx=-Infinity;
    grid.forEach(r=>r.forEach(v=>{if(v!=null){if(v<mn)mn=v;if(v>mx)mx=v;}}));
    minV=mn===Infinity?0:mn; maxV=mx===-Infinity?5:mx;
  }
  // Both grids: col=0 → most-negative PlateLocSide = 1st base side = catcher's RIGHT = positive scene.x
  // Plane is rotated 180°Y so its front face points toward catcher (-Z). With that rotation,
  // canvas col=0 (u≈0) maps to world x=+pw/2 (catcher's right) → 1st base ✓
  // flipCols=false is correct with the rotation applied below.

  const cvs = document.createElement('canvas');
  cvs.width = Math.max(cols,1); cvs.height = Math.max(rows,1);
  const ctx = cvs.getContext('2d');
  ctx.clearRect(0,0,cvs.width,cvs.height);
  const range = maxV - minV || 1;

  for (let r=0;r<rows;r++) {
    for (let c=0;c<cols;c++) {
      const v = grid[r]?.[c];
      if (v == null) continue;
      let R, G, B;
      if (type === 'effectiveness') {
        // relative: worst zone in dataset=red → best zone=green
        const t = Math.max(0,Math.min(1,(v-minV)/range));
        R = Math.round(200*(1-t)+30*t); G = Math.round(40*(1-t)+210*t); B = 60;
      } else {
        // 0=tight tunnel(green) → far=red
        const t = Math.max(0,Math.min(1,(v-minV)/range));
        R = Math.round(30+190*t); G = Math.round(200-170*t); B = 60;
      }
      ctx.fillStyle = \`rgba(\${R},\${G},\${B},0.82)\`;
      // Grid: row 0 = hMin (bottom), canvas y=0 = top → flip row
      // Grid: col 0 = sMin (most-negative PlateLocSide = 1B side = catcher right)
      // Plane default: left edge (u=0) → world x=-pw/2, right (u=1) → x=+pw/2
      // We want col=0 (1B) on catcher's right = positive scene.x, so flip cols
      ctx.fillRect(c, rows-1-r, 1, 1);
    }
  }

  const tex = new THREE.CanvasTexture(cvs);
  tex.needsUpdate = true;
  const pw = xMax - xMin, ph = yMax - yMin;
  const cy = (yMin + yMax) / 2;
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(pw, ph),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.72, side: THREE.DoubleSide, depthWrite: false })
  );
  // Center at x=0 (plate center). Plane faces +Z by default (toward pitcher), which is fine.
  mesh.position.set(0, cy, 0.03);
  return mesh;
}

function recompute() {
  const s = state;
  const refPitches = s.pitcherId && s.refType ? filterPitches(s.pitches, s.pitcherId, s.refType) : [];
  const tunPitches = s.pitcherId && s.tunnelType ? filterPitches(s.pitches, s.pitcherId, s.tunnelType) : [];

  s.refPitch = refPitches.length
    ? (s.refMode==='auto' ? getBestPitchAuto(refPitches) : s.refZone ? getBestPitchForZone(refPitches, s.refZone) : null)
    : null;
  s.tunnelPitch = tunPitches.length
    ? (s.tunnelMode==='auto' ? getBestPitchAuto(tunPitches) : s.tunnelZone ? getBestPitchForZone(tunPitches, s.tunnelZone) : null)
    : null;

  s.refCoeffs = s.refPitch ? getCoeffs(s.refPitch) : null;
  s.tunnelCoeffs = s.tunnelPitch ? getCoeffs(s.tunnelPitch) : null;
  s.avgTunnelCoeffs = tunPitches.length ? avgCoeffs(tunPitches) : null;

  s.tunnelDist = (s.refCoeffs && s.tunnelCoeffs) ? tunnelDist(s.refCoeffs, s.tunnelCoeffs) : null;
  s.divPoint   = (s.refCoeffs && s.tunnelCoeffs) ? divergencePoint(s.refCoeffs, s.tunnelCoeffs) : null;
  s.effHeatmap = refPitches.length ? computeEffHeatmap(refPitches) : null;

  // Zone score maps for grids
  s.refZoneScores = zoneAvgScores(refPitches);
  s.tunZoneScores = zoneAvgScores(tunPitches);

  // Target trajectory: use avg tunnel coeffs back-solved to user-specified plate location
  if (s.showTarget && s.avgTunnelCoeffs) {
    s.tgtCoeffs = coeffsForTarget(s.avgTunnelCoeffs, s.targetH, -s.targetS);
    s.tgtDist = (s.refCoeffs && s.tgtCoeffs) ? tunnelDist(s.refCoeffs, s.tgtCoeffs) : null;
  } else {
    s.tgtCoeffs = null; s.tgtDist = null;
  }
}

// ARSENAL MODE
// ═══════════════════════════════════════════════════════════════════════════════
function initArsenal() {
  const s = state;
  if (!s.pitcherId) return;
  const types = getPitchTypes(s.pitches, s.pitcherId);
  // Preserve existing locations if already set
  const prev = s.arsenalTypes;
  s.arsenalTypes = {};
  let firstType = null;
  for (const type of types) {
    const pitcherPitches = filterPitches(s.pitches, s.pitcherId, type);
    const ac = avgCoeffs(pitcherPitches);
    if (!ac) continue;
    // Get real avg plate location from avg coefficients
    const realPos = posAtPlate(ac);
    const realH = realPos ? realPos.height : 2.5;
    const realS = realPos ? -realPos.horiz : 0; // PlateLocSide = -Zc
    const existing = prev[type];
    s.arsenalTypes[type] = {
      active: existing ? existing.active : true,
      isAnchor: existing ? existing.isAnchor : false,
      h: existing ? existing.h : realH,
      s: existing ? existing.s : realS,
      realH, realS,
      avgCoeffs: ac,
      locCoeffs: null,
      tunnelDist: null,
      count: pitcherPitches.length,
    };
    if (!firstType) firstType = type;
  }
  // Ensure exactly one anchor — pick the one with most pitches if none set
  const hasAnchor = Object.values(s.arsenalTypes).some(e => e.isAnchor);
  if (!hasAnchor && firstType) {
    // Pick pitch type with most pitches as default anchor
    let maxC = 0, anchorType = firstType;
    for (const [t, e] of Object.entries(s.arsenalTypes)) {
      if (e.count > maxC) { maxC = e.count; anchorType = t; }
    }
    s.arsenalTypes[anchorType].isAnchor = true;
  }
}

function recomputeArsenal() {
  const s = state;
  let anchorType = Object.keys(s.arsenalTypes).find(t => s.arsenalTypes[t].isAnchor);
  for (const [type, entry] of Object.entries(s.arsenalTypes)) {
    if (!entry.avgCoeffs) { entry.locCoeffs = null; continue; }
    // Every pitch (anchor included) is positioned via its h/s sliders.
    // Anchor defaults to realH/realS but can be moved freely.
    entry.locCoeffs = coeffsForTarget(entry.avgCoeffs, entry.h, -entry.s);
  }
  // Compute tunnel distances from anchor
  const anchor = anchorType ? s.arsenalTypes[anchorType] : null;
  for (const [type, entry] of Object.entries(s.arsenalTypes)) {
    if (!entry.active || type === anchorType || !anchor?.locCoeffs || !entry.locCoeffs) {
      entry.tunnelDist = null; continue;
    }
    entry.tunnelDist = tunnelDist(anchor.locCoeffs, entry.locCoeffs);
  }
}

function clearArsenalObjects() {
  for (const obj of arsenalObjects) {
    if (obj.line) { scene.remove(obj.line); obj.line.geometry?.dispose(); obj.line.material?.dispose(); }
    if (obj.sphere23) { scene.remove(obj.sphere23); obj.sphere23.geometry?.dispose(); obj.sphere23.material?.dispose(); }
    if (obj.sphereP) { scene.remove(obj.sphereP); obj.sphereP.geometry?.dispose(); obj.sphereP.material?.dispose(); }
    if (obj.aimMarker) disposeAimMarker(obj.aimMarker);
    if (obj.aimConnector) { scene.remove(obj.aimConnector); obj.aimConnector.geometry?.dispose(); obj.aimConnector.material?.dispose(); }
  }
  arsenalObjects = [];
}

function renderArsenal() {
  clearArsenalObjects();
  const s = state;
  let anchorType = Object.keys(s.arsenalTypes).find(t => s.arsenalTypes[t].isAnchor);
  const anchor = anchorType ? s.arsenalTypes[anchorType] : null;
  const fbCoeffs = getFbCoeffs(s.arsenalTypes); // fastball baseline for aim
  for (const [type, entry] of Object.entries(s.arsenalTypes)) {
    if (!entry.active || !entry.locCoeffs) continue;
    const color = pitchColor(type);
    const opacity = entry.isAnchor ? 1.0 : 0.75;
    const pts = trajectoryPoints(entry.locCoeffs);
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({ color: parseInt(color.replace('#',''),16), transparent: opacity<1, opacity });
    const line = new THREE.Line(geo, mat);
    scene.add(line);
    const p23 = posAt23(entry.locCoeffs);
    const sphere23 = p23 ? makeSphere({horiz:p23.horiz, height:p23.height, dist:23}, entry.isAnchor?0.11:0.09, color, 0.5) : null;
    if (sphere23) scene.add(sphere23);
    const pFront = posAtFrontOfPlate(entry.locCoeffs);
    const sphereP = pFront ? makeSphere({horiz:pFront.horiz, height:pFront.height, dist:0}, entry.isAnchor?0.15:0.13, color, 0.55) : null;
    if (sphereP) scene.add(sphereP);
    let aimMarker = null, aimConnector = null;
    if (s.showAim) {
      const aim = aimPointAtPlate(entry.locCoeffs, fbCoeffs);
      if (aim) {
        aimMarker = makeAimMarker(aim, color);
        scene.add(aimMarker);
        // Connector line from aim → actual endpoint (visually shows the break)
        const ep = posAtFrontOfPlate(entry.locCoeffs);
        if (ep) {
          aimConnector = makeAimConnector(aim, {horiz: ep.horiz, height: ep.height, dist: 0}, color);
          scene.add(aimConnector);
        }
      }
    }
    arsenalObjects.push({ line, sphere23, sphereP, aimMarker, aimConnector });
    // Connect line from anchor at 23ft
    if (!entry.isAnchor && anchor?.locCoeffs) {
      const p23a = posAt23(anchor.locCoeffs);
      if (p23a && p23) {
        const cl = makeConnectLine(p23a, p23);
        scene.add(cl);
        arsenalObjects.push({ line: cl });
      }
    }
  }
}

function renderArsenalUI() {
  const s = state;
  const el = document.getElementById('arsenal-list');
  if (!el) return;
  el.innerHTML = '';
  for (const [type, entry] of Object.entries(s.arsenalTypes)) {
    const color = pitchColor(type);
    const g = entry.tunnelDist != null ? tunnelGrade(entry.tunnelDist) : null;
    const row = document.createElement('div');
    const isCardSel = (s.cardPitchType ? s.cardPitchType === type : entry.isAnchor);
    row.className = 'arsenal-row' + (entry.isAnchor ? ' is-anchor' : '') + (isCardSel ? ' card-sel' : '');
    row.setAttribute('data-type', type);

    // Header row (always shown)
    let html = \`<div class="arsenal-row-hdr">
      <input type="checkbox" class="arsl-chk" \${entry.active?'checked':''} style="accent-color:\${color};width:13px;height:13px;flex-shrink:0;cursor:pointer"/>
      <span class="arsenal-dot" style="background:\${color}"></span>
      <span class="arsenal-name">\${type} <span style="color:#64748b;font-weight:400">(\${entry.count})</span></span>
      <span class="anchor-tag" title="\${entry.isAnchor?'Currently anchor — click another to change':'Set as anchor pitch'}">\${entry.isAnchor ? 'Anchor' : 'Set anchor'}</span>
    </div>\`;

    // H and S sliders + reset — anchor AND non-anchor both get this now so
    // you can pick exactly where the anchor pitch should go and tunnel others to it.
    const footerRight = entry.isAnchor
      ? '<span style="font-size:9px;color:#FFD700">target location</span>'
      : (g ? \`<span class="arsenal-tdist metric-tag \${g.cls}">\${entry.tunnelDist.toFixed(1)}" tunnel</span>\` : '<span></span>');
    html += \`<div class="arsenal-sliders">
      <div class="arsl-slider-row">
        <span class="arsl-lbl">H</span>
        <input type="range" class="arsl-h" min="0.5" max="5.0" step="0.05" value="\${entry.h.toFixed(2)}" style="accent-color:\${color}"/>
        <span class="arsl-val arsl-hval">\${entry.h.toFixed(2)}</span>
      </div>
      <div class="arsl-slider-row">
        <span class="arsl-lbl">S</span>
        <input type="range" class="arsl-s" min="-2.0" max="2.0" step="0.05" value="\${entry.s.toFixed(2)}" style="accent-color:\${color}"/>
        <span class="arsl-val arsl-sval">\${entry.s.toFixed(2)}</span>
      </div>
      <div class="arsl-slider-footer">
        <span class="reset-tag" title="Reset to real average location">reset</span>
        \${footerRight}
      </div>
    </div>\`;

    row.innerHTML = html;

    // ── Checkbox: stop click bubbling AND handle change ──
    const chk = row.querySelector('.arsl-chk');
    chk.addEventListener('click', e => e.stopPropagation());
    chk.addEventListener('change', e => {
      entry.active = e.target.checked;
      update();
    });

    // ── Anchor tag ──
    row.querySelector('.anchor-tag').addEventListener('click', e => {
      e.stopPropagation();
      if (entry.isAnchor) return; // already anchor
      for (const en of Object.values(s.arsenalTypes)) en.isAnchor = false;
      entry.isAnchor = true;
      // Keep wherever the user last positioned it — don't snap back to real avg.
      update();
    });

    // ── Row header click: select this pitch for the movement card ──
    row.querySelector('.arsenal-row-hdr').addEventListener('click', e => {
      s.cardPitchType = (s.cardPitchType === type) ? null : type;
      // update card + highlight without full re-render
      document.querySelectorAll('#arsenal-list .arsenal-row').forEach(r => {
        const t = r.getAttribute('data-type');
        const active = s.cardPitchType ? s.cardPitchType === t : s.arsenalTypes[t]?.isAnchor;
        r.classList.toggle('card-sel', !!active);
      });
      renderMvmtCard();
    });

    // ── H slider ──
    const hSlider = row.querySelector('.arsl-h');
    const hVal    = row.querySelector('.arsl-hval');
    hSlider.addEventListener('click', e => e.stopPropagation());
    hSlider.addEventListener('input', e => {
      e.stopPropagation();
      entry.h = parseFloat(e.target.value);
      hVal.textContent = entry.h.toFixed(2);
      updateArsenalScene();
    });

    // ── S slider ──
    const sSlider = row.querySelector('.arsl-s');
    const sVal    = row.querySelector('.arsl-sval');
    sSlider.addEventListener('click', e => e.stopPropagation());
    sSlider.addEventListener('input', e => {
      e.stopPropagation();
      entry.s = parseFloat(e.target.value);
      sVal.textContent = entry.s.toFixed(2);
      updateArsenalScene();
    });

    // ── Reset ──
    const resetTag = row.querySelector('.reset-tag');
    resetTag.addEventListener('click', e => {
      e.stopPropagation();
      entry.h = entry.realH; entry.s = entry.realS;
      update();
    });

    el.appendChild(row);
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// ARSENAL SCENE UPDATE (no DOM rebuild — safe to call during slider drag)
// ═══════════════════════════════════════════════════════════════════════════════
function updateArsenalScene() {
  recomputeArsenal();
  renderScene();
  renderArsenal();
  renderLegend();
  renderMvmtCard();
  // Update tunnel distance badges in-place without rebuilding the DOM
  for (const [type, entry] of Object.entries(state.arsenalTypes)) {
    const row = document.querySelector(\`[data-type="\${CSS.escape(type)}"]\`);
    if (!row) continue;
    const badge = row.querySelector('.arsenal-tdist');
    if (entry.tunnelDist != null) {
      const g = tunnelGrade(entry.tunnelDist);
      if (badge) {
        badge.textContent = entry.tunnelDist.toFixed(1) + '" tunnel';
        badge.className = \`arsenal-tdist metric-tag \${g.cls}\`;
      }
    } else if (badge) {
      badge.textContent = '';
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// RENDER SCENE OBJECTS
// ═══════════════════════════════════════════════════════════════════════════════
function renderScene() {
  const s = state;
  // Remove old dynamic objects
  clearArsenalObjects();
  removeFromScene(refLine, refSphere23, refSpherePlate);
  removeFromScene(tunLine, tunSphere23, tunSpherePlate);
  removeFromScene(optLine, optSpherePlate);
  removeFromScene(tgtLine, tgtSpherePlate, tgtSphere23);
  removeFromScene(connectLine, divMarker, heatmapMesh);
  disposeAimMarker(refAimMarker); disposeAimMarker(tunAimMarker);
  disposeAimMarker(optAimMarker); disposeAimMarker(tgtAimMarker);
  if (refAimConnector) { scene.remove(refAimConnector); refAimConnector.geometry?.dispose(); refAimConnector.material?.dispose(); }
  if (tunAimConnector) { scene.remove(tunAimConnector); tunAimConnector.geometry?.dispose(); tunAimConnector.material?.dispose(); }
  refAimConnector = tunAimConnector = null;
  refLine=refSphere23=refSpherePlate=null;
  tunLine=tunSphere23=tunSpherePlate=null;
  optLine=optSpherePlate=null;
  tgtLine=tgtSpherePlate=tgtSphere23=null;
  connectLine=divMarker=heatmapMesh=null;
  refAimMarker=tunAimMarker=optAimMarker=tgtAimMarker=null;

  // In arsenal mode, only renderArsenal() is responsible for drawing trajectories —
  // skip all analysis-mode ref/tunnel/opt/target drawing to avoid duplicate lines.
  if (s.arsenalMode) return;

  const refColor = pitchColor(s.refType);
  const tunColor = pitchColor(s.tunnelType);

  if (s.refCoeffs) {
    const { line, sphere23, sphereP } = drawTrajectory(s.refCoeffs, refColor);
    refLine=line; refSphere23=sphere23; refSpherePlate=sphereP;
    scene.add(line); if(sphere23)scene.add(sphere23); if(sphereP)scene.add(sphereP);
    if (s.showAim) {
      const aim = aimPointAtPlate(s.refCoeffs, s.refCoeffs); // ref = its own baseline → aim = endpoint
      if (aim) {
        refAimMarker = makeAimMarker(aim, refColor); scene.add(refAimMarker);
        const ep = posAtFrontOfPlate(s.refCoeffs);
        if (ep) { const cl = makeAimConnector(aim, ep, refColor); scene.add(cl); refAimConnector = cl; }
      }
    }
  }
  if (s.tunnelCoeffs) {
    const { line, sphere23, sphereP } = drawTrajectory(s.tunnelCoeffs, tunColor);
    tunLine=line; tunSphere23=sphere23; tunSpherePlate=sphereP;
    scene.add(line); if(sphere23)scene.add(sphere23); if(sphereP)scene.add(sphereP);
    if (s.showAim) {
      const aim = aimPointAtPlate(s.tunnelCoeffs, s.refCoeffs || s.tunnelCoeffs);
      if (aim) {
        tunAimMarker = makeAimMarker(aim, tunColor); scene.add(tunAimMarker);
        const ep = posAtFrontOfPlate(s.tunnelCoeffs);
        if (ep) { const cl = makeAimConnector(aim, ep, tunColor); scene.add(cl); tunAimConnector = cl; }
      }
    }
  }
  if (s.showOpt && s.optCoeffs) {
    const { line, sphereP } = drawTrajectory(s.optCoeffs, '#00FF88');
    optLine=line; optSpherePlate=sphereP;
    scene.add(line); if(sphereP)scene.add(sphereP);
    if (s.showAim) {
      const aim = aimPointAtPlate(s.optCoeffs);
      if (aim) { optAimMarker = makeAimMarker(aim, '#00FF88'); scene.add(optAimMarker); }
    }
  }
  if (s.showTarget && s.tgtCoeffs) {
    const { line, sphere23, sphereP } = drawTrajectory(s.tgtCoeffs, '#FF9900');
    tgtLine=line; tgtSphere23=sphere23; tgtSpherePlate=sphereP;
    scene.add(line); if(sphere23)scene.add(sphere23); if(sphereP)scene.add(sphereP);
    if (s.showAim) {
      const aim = aimPointAtPlate(s.tgtCoeffs);
      if (aim) { tgtAimMarker = makeAimMarker(aim, '#FF9900'); scene.add(tgtAimMarker); }
    }
  }
  if (s.refCoeffs && s.tunnelCoeffs) {
    const p23r = posAt23(s.refCoeffs), p23t = posAt23(s.tunnelCoeffs);
    if (p23r && p23t) {
      connectLine = makeConnectLine(p23r, p23t);
      scene.add(connectLine);
    }
  }
  if (s.divPoint && s.refCoeffs) {
    const t = tAtDist(s.refCoeffs, s.divPoint.dist);
    if (t) { const p = posAt(s.refCoeffs, t); divMarker=makeDivMarker(p); scene.add(divMarker); }
  }
  // Heatmap (tunnel quality only)
  if (s.showTunnelHeat && s.tunnelHeatmap) {
    heatmapMesh = makeHeatmapMesh(s.tunnelHeatmap, 'tunnel');
    if (heatmapMesh) scene.add(heatmapMesh);
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// RENDER UI
// ═══════════════════════════════════════════════════════════════════════════════
async function update() {
  const s = state;
  ++_heatmapToken; // invalidate any pending heatmap

  // Show/hide panel sections based on mode
  const analysisEls = ['ref-section','tunnel-section','chk-opt-row','chk-tunnel-heat-row','target-section'];
  analysisEls.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = s.arsenalMode ? 'none' : '';
  });
  document.getElementById('arsenal-section').style.display = s.arsenalMode && s.pitcherId ? '' : 'none';

  if (s.arsenalMode) {
    updateArsenalScene();
    renderArsenalUI();
    // clear analysis metrics
    document.getElementById('m-tunnel').textContent = '—';
    document.getElementById('m-tunnel-grade').textContent = '';
    document.getElementById('m-div').textContent = '—';
    document.getElementById('m-opt-loc').textContent = '—';
    document.getElementById('m-opt-dist').textContent = '—';
    document.getElementById('m-opt-grade').textContent = '';
    renderLegend();
    return;
  }

  // Hide movement card when not in arsenal mode
  const _mc = document.getElementById('mvmt-card');
  if (_mc) _mc.style.display = 'none';

  recompute();         // fast: pitch selection, trajectories, divergence
  renderScene();       // draw trajectories immediately
  updateUI();          // show current metrics without heatmap

  // Compute tunnel heatmap async (heavy ~45k iterations) so UI stays responsive
  const token = ++_heatmapToken;
  if (s.refCoeffs && s.avgTunnelCoeffs) {
    await new Promise(r => setTimeout(r, 0));
    if (token !== _heatmapToken) return;
    s.tunnelHeatmap = computeTunnelHeatmap(s.refCoeffs, s.avgTunnelCoeffs);
    if (s.tunnelHeatmap?.minCell) {
      const { h, plateSide } = s.tunnelHeatmap.minCell;
      s.optCoeffs = coeffsForTarget(s.avgTunnelCoeffs, h, -plateSide);
      s.optLoc = { h, s: plateSide };
      s.optDist = s.tunnelHeatmap.minCell.d;
    } else {
      s.optCoeffs = null; s.optLoc = null; s.optDist = null;
    }
    if (token !== _heatmapToken) return;
    renderScene();
    updateUI();
  } else {
    s.tunnelHeatmap = null;
    s.optCoeffs = null; s.optLoc = null; s.optDist = null;
  }
}

function tunnelGrade(inches) {
  if (inches == null) return null;
  if (inches <= 3)  return { cls: 'elite', label: 'Elite' };
  if (inches <= 6)  return { cls: 'good',  label: 'Good'  };
  if (inches <= 10) return { cls: 'avg',   label: 'Avg'   };
  return               { cls: 'poor',   label: 'Poor'  };
}
function setGradeTag(id, inches) {
  const el = document.getElementById(id);
  if (!el) return;
  const g = tunnelGrade(inches);
  if (!g) { el.textContent = ''; el.className = 'metric-tag'; return; }
  el.textContent = g.label;
  el.className = \`metric-tag \${g.cls}\`;
}

function updateUI() {
  const s = state;
  // Info panel
  document.getElementById('m-tunnel').textContent = s.tunnelDist != null ? \`\${s.tunnelDist.toFixed(1)}"\` : '—';
  setGradeTag('m-tunnel-grade', s.tunnelDist);
  document.getElementById('m-div').textContent = s.divPoint ? \`\${s.divPoint.dist.toFixed(1)} ft\` : '—';
  { const noteEl = document.getElementById('m-div-note');
    if (noteEl) noteEl.textContent = s.divPoint ? 'from plate' : ''; }
  document.getElementById('m-opt-loc').textContent = s.optLoc ? \`\${s.optLoc.h.toFixed(2)}ft H  /  \${s.optLoc.s.toFixed(2)}ft S\` : '—';
  document.getElementById('m-opt-dist').textContent = s.optDist != null ? \`\${s.optDist.toFixed(1)}"\` : '—';
  setGradeTag('m-opt-grade', s.optDist);
  // Show target section only when tunnel pitch type is selected
  document.getElementById('target-section').style.display = s.avgTunnelCoeffs ? '' : 'none';
  // Pitch cards
  renderPitchCard('ref', s.refPitch);
  renderPitchCard('tunnel', s.tunnelPitch);
  // Zone grids
  renderZoneGrid('ref', s.refZoneScores, s.refZone);
  renderZoneGrid('tunnel', s.tunZoneScores, s.tunnelZone);
  // Legend
  renderLegend();
}

function renderPitchCard(which, pitch) {
  const el = document.getElementById(\`\${which}-card\`);
  if (!pitch) {
    el.className='pitch-card empty';
    el.innerHTML='<span class="pitch-empty">No pitch selected</span>';
    return;
  }
  el.className='pitch-card';
  const score = scorePitch(pitch);
  const fmt = (v, dec, unit) => (v && v !== '' && v !== 'NA') ? \`\${parseFloat(v).toFixed(dec)}\${unit}\` : '—';
  const outcome = pitch.PitchCall === 'InPlay' && pitch.PlayResult && pitch.PlayResult !== 'Undefined'
    ? \`InPlay (\${pitch.PlayResult})\` : (pitch.PitchCall || '—');
  el.innerHTML = \`
    <div class="card-row"><span class="card-key">Velocity</span><span class="card-val">\${fmt(pitch.RelSpeed,1,' mph')}</span></div>
    <div class="card-row"><span class="card-key">Spin</span><span class="card-val">\${fmt(pitch.SpinRate,0,' rpm')}</span></div>
    <div class="card-row"><span class="card-key">iVB / HB</span><span class="card-val">\${fmt(pitch.InducedVertBreak,1,'"')} / \${fmt(pitch.HorzBreak,1,'"')}</span></div>
    <div class="card-row"><span class="card-key">VAA</span><span class="card-val">\${fmt(pitch.VertApprAngle,1,'°')}</span></div>
    <div class="card-row"><span class="card-key">Location</span><span class="card-val">\${fmt(pitch.PlateLocHeight,2,' h')} / \${fmt(pitch.PlateLocSide,2,' s')}</span></div>
    <div class="card-row"><span class="card-key">Outcome</span><span class="card-val">\${outcome}</span></div>\`;
}

function scoreToColor(score) {
  if (score == null) return 'rgba(255,255,255,0.05)';
  const t = Math.max(0, Math.min(1, score / 5));
  const r = Math.round(200*(1-t)+40*t), g = Math.round(40*(1-t)+200*t);
  return \`rgba(\${r},\${g},60,0.55)\`;
}

function renderZoneGrid(which, scores, selZone) {
  const el = document.getElementById(\`\${which}-zone-grid\`);
  el.innerHTML = '';
  // Pitcher's view — cells are laid out left-to-right from the PITCHER's
  // perspective and numbered 1-9 across/down in that view (1=top-left,
  // 2=top-mid, 3=top-right, …, 9=bottom-right).
  // Underlying data zones follow the standard catcher-view convention, so
  // we map each visible position → its corresponding catcher zone.
  //   visual 1 (pitcher top-left)  = catcher zone 3
  //   visual 2                     = catcher zone 2
  //   visual 3 (pitcher top-right) = catcher zone 1
  //   visual 4 = catcher 6, 5 = 5, 6 = 4
  //   visual 7 = catcher 9, 8 = 8, 9 = 7
  const order = [3,2,1, 6,5,4, 9,8,7];  // catcher-zone per visual slot
  order.forEach((dataZone, idx) => {
    const visualNum = idx + 1;          // 1-9 as shown to the pitcher
    const cell = document.createElement('div');
    cell.className = 'zone-cell' + (selZone===dataZone?' sel':'');
    cell.style.backgroundColor = scoreToColor(scores?.[dataZone]);
    const score = scores?.[dataZone];
    cell.innerHTML = \`<span class="z-num">\${visualNum}</span>\`;
    cell.title = score!=null
      ? \`Zone \${visualNum} (pitcher view): avg score \${score.toFixed(2)}\`
      : \`Zone \${visualNum} (pitcher view): no data\`;
    cell.addEventListener('click', () => {
      if (which==='ref') { state.refZone = state.refZone===dataZone?null:dataZone; }
      else { state.tunnelZone = state.tunnelZone===dataZone?null:dataZone; }
      update();
    });
    el.appendChild(cell);
  });
}

function renderMvmtCard() {
  const card = document.getElementById('mvmt-card');
  if (!card) return;
  const s = state;
  // Find the anchor pitch to display (anchor = the reference/selected pitch)
  if (!s.arsenalMode || !s.pitcherId) { card.style.display = 'none'; return; }
  const anchorType = Object.keys(s.arsenalTypes).find(t => s.arsenalTypes[t].isAnchor);
  const displayType = s.cardPitchType || anchorType;
  if (!displayType) { card.style.display = 'none'; return; }
  const pitches = filterPitches(s.pitches, s.pitcherId, displayType);
  if (!pitches.length) { card.style.display = 'none'; return; }

  const avg = (arr) => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  const num = v => { const n=parseFloat(v); return isNaN(n)?null:n; };
  const vals = (field) => pitches.map(p=>num(p[field])).filter(v=>v!=null);

  const velo   = avg(vals('RelSpeed'));
  const ivb    = avg(vals('InducedVertBreak'));
  const hb     = avg(vals('HorzBreak'));
  const spin   = avg(vals('SpinRate'));
  const ext    = avg(vals('Extension'));
  const color  = pitchColor(displayType);

  const f1 = (v,sfx='') => v!=null ? v.toFixed(1)+sfx : '—';
  const f0 = (v,sfx='') => v!=null ? Math.round(v)+sfx : '—';

  card.style.display = 'block';

}

function renderLegend() {
  const s = state;
  const leg = document.getElementById('legend');
  leg.innerHTML = '';
  const add = (label, color) => {
    const d = document.createElement('div');
    d.className='leg-item';
    d.innerHTML=\`<span class="leg-dot" style="background:\${color}"></span><span>\${label}</span>\`;
    leg.appendChild(d);
  };
  if (s.arsenalMode) {
    for (const [type, entry] of Object.entries(s.arsenalTypes)) {
      if (!entry.active) continue;
      const label = entry.isAnchor ? \`\${type} (anchor)\` : type;
      add(label, pitchColor(type));
    }
  } else {
    if (s.refType) add(s.refType, pitchColor(s.refType));
    if (s.tunnelType) add(s.tunnelType, pitchColor(s.tunnelType));
    if (s.showOpt && s.optCoeffs) add('Optimized', '#00FF88');
    if (s.showTarget && s.tgtCoeffs) {
      const tgtLabel = s.tgtDist != null ? \`Target (\${s.tgtDist.toFixed(1)}")\` : 'Target';
      add(tgtLabel, '#FF9900');
    }
    if (s.divPoint) add('Divergence', '#FF8844');
  }
}

function populatePitchers() {
  const sel = document.getElementById('pitcher-sel');
  const pitchers = getPitchers(state.pitches, state.queensOnly);
  sel.innerHTML = '<option value="">— Select Pitcher —</option>';
  pitchers.forEach(p => {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.name + (p.throws ? \` (\${p.throws})\` : '');
    sel.appendChild(o);
  });
  if (pitchers.length > 0 && !state.pitcherId) {
    state.pitcherId = pitchers[0].id;
    sel.value = state.pitcherId;
    populatePitchTypes();
    if (state.arsenalMode) initArsenal();
  }
}

function populatePitchTypes() {
  const types = state.pitcherId ? getPitchTypes(state.pitches, state.pitcherId) : [];
  // Count pitches per type for this pitcher
  const counts = {};
  if (state.pitcherId) {
    for (const p of state.pitches) {
      if (p.PitcherId === state.pitcherId && p.pitchType && p.pitchType !== 'Unknown') {
        counts[p.pitchType] = (counts[p.pitchType] || 0) + 1;
      }
    }
  }
  ['ref-type','tunnel-type'].forEach((id,i)=>{
    const sel = document.getElementById(id);
    const cur = i===0 ? state.refType : state.tunnelType;
    sel.innerHTML = '<option value="">— Select —</option>';
    types.forEach(t => {
      const o = document.createElement('option');
      o.value = t;
      o.textContent = counts[t] ? \`\${t} (\${counts[t]})\` : t;
      if (t===cur) o.selected=true;
      sel.appendChild(o);
    });
  });
}

  for (const file of files) {

    if (existing) existing.count = newPitches.length;
    else state.loadedFiles.push({ name: file.name, count: newPitches.length });
  }
  renderLoadedFiles();
  populatePitchers();
  populatePitchTypes();
  update();

// Verification helper: when Show Aim Point is toggled ON, print a table for
// each active arsenal pitch so the user can audit the math vs Trackman.
// Columns:
//   type, endpointH(ft), endpointS(ft), aimH(ft), aimS(ft),
//   vOffset(in) — aim-minus-endpoint vertical (negative = aim below endpoint),
//   hOffset(in) — aim-minus-endpoint horizontal (poly-Z sign),
//   IVB(in), HB(in) — from the pitch's own locCoeffs (should equal −vOffset / −hOffset)
function logAimVerification() {
  const s = state;
  if (!s.arsenalTypes) return;
  const rows = [];
  for (const [type, entry] of Object.entries(s.arsenalTypes)) {
    if (!entry.active || !entry.locCoeffs) continue;
    const fbC = getFbCoeffs(s.arsenalTypes);
    const aim = aimPointAtPlate(entry.locCoeffs, fbC);
    const off = aimOffsetInches(entry.locCoeffs);
    if (!aim || !off) continue;
    const ep = posAtFrontOfPlate(entry.locCoeffs);
    rows.push({
      type,
      endpointH_ft: ep ? +ep.height.toFixed(3) : null,
      endpointS_ft: ep ? +(-ep.horiz).toFixed(3) : null, // flip to "plate side" convention
      aimH_ft: +aim.height.toFixed(3),
      aimS_ft: +(-aim.horiz).toFixed(3),
      vOffset_in: +off.aimDV_in.toFixed(2),
      hOffset_in: +off.aimDH_in.toFixed(2),
      IVB_in: +off.ivb_in.toFixed(2),
      HB_in:  +off.hb_in.toFixed(2),
    });
  }
  if (rows.length) {
    console.log('[Aim Point] spinless-ball-with-gravity — aim offset should equal −IVB / −HB');
    console.table(rows);
  }
}

// Optimize Tunnels — snap every non-anchor pitch to its minimum-tunnel location
// relative to the current anchor (anchor itself stays where it is).
document.getElementById('optimize-all-btn').addEventListener('click', () => {
  const s = state;
  if (!s.arsenalMode) return;
  const anchorType = Object.keys(s.arsenalTypes).find(t => s.arsenalTypes[t].isAnchor);
  if (!anchorType) return;
  const anchor = s.arsenalTypes[anchorType];
  if (!anchor.locCoeffs) return;
  for (const [type, entry] of Object.entries(s.arsenalTypes)) {
    if (type === anchorType || !entry.active || !entry.avgCoeffs) continue;
    const hm = computeTunnelHeatmap(anchor.locCoeffs, entry.avgCoeffs);
    if (!hm || !hm.minCell) continue;
    // minCell.plateSide is in PlateLocSide space (what entry.s expects); minCell.h is PlateLocHeight
    entry.h = Math.max(0.5, Math.min(5.0, hm.minCell.h));
    entry.s = Math.max(-2.0, Math.min(2.0, hm.minCell.plateSide));
  }
  update();
});

// Reset every arsenal pitch back to its real average plate location

  if (!s.arsenalMode) return;
  for (const entry of Object.values(s.arsenalTypes)) {

    if (entry.realS != null) entry.s = entry.realS;
  }
  update();
});

window.addEventListener('message', e => {

  // Normalize to tunneling format (add pitchType + uid if missing)
  const pitches = e.data.pitches.map(row => {
    if (!row.pitchType) {
      const tagged = row.TaggedPitchType;
      const auto   = row.AutoPitchType;
      const raw = (tagged && tagged !== 'Undefined' && tagged !== '') ? tagged
                : (auto   && auto   !== 'Undefined' && auto   !== '') ? auto : 'Unknown';
      row.pitchType = normalizePitchType(raw);
    }
    if (!row.uid) row.uid = row.PitchUID || \`\${row.Date}_\${row.Time}_\${row.Pitcher}_\${row.PitchNo}\`;
    return row;
  });
  state.pitches = pitches;
  state.loadedFiles = [{ name: 'shared', count: pitches.length }];
  renderLoadedFiles();
  populatePitchers();
  populatePitchTypes();
  update();
});

      row.pitchType = normalizePitchType((t && t !== 'Undefined') ? t : (a && a !== 'Undefined') ? a : 'Unknown');

    if (!row.uid) row.uid = row.PitchUID || '';
  });

};
